<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neuroroute — Füllstand</title>
<style>
  html, body { margin: 0; background: #03050a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  window.ready = new Promise((resolve) => { window.__resolveReady = resolve; });
</script>
<script type="module">
// Neuroroute "Füllstand". A pure function of time: window.seek(t) paints frame t.
// No timers, no CSS transitions, no state carried between frames, no Math.random.
import { spring, clamp } from '../lib/motion.js';
import { BPM, BEATS, EV, SHOTS } from './cues.mjs';

// ------------------------------------------------------------------ setup

const W = 1080, H = 1920; // 9:16 master
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const main = canvas.getContext('2d');
let g = main; // the context everything draws into; swapped for depth layers

const offscreen = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const scratch = offscreen(), sg = scratch.getContext('2d');
const layer = offscreen(), lg = layer.getContext('2d');
const smearBuf = offscreen(), smg = smearBuf.getContext('2d');
const tmpBuf = offscreen(), tg = tmpBuf.getContext('2d');
// a panel drawn into a layer for its 3D swing still frosts the real frame
let glassSrc = null;

const C = {
  bg: '#03050a', ink: '#eef3fb', text: '#dde6f5', muted: '#8a9dbf', dim: '#3a4862',
  cyan: '#00d4ff', green: '#00ff9d', amber: '#ffb340', indigo: '#4f7cff',
};
const D = '"Bebas Neue"', UI = 'Outfit';
const font = (px, fam = D, weight = '') => `${weight} ${px}px ${fam}`.trim();

await Promise.all([
  new FontFace('Bebas Neue', 'url(../fonts/BebasNeue.woff2)').load(),
  new FontFace('Outfit', 'url(../fonts/Outfit.woff2)', { weight: '100 900' }).load(),
].map(async (p) => document.fonts.add(await p)));

// ------------------------------------------------------------------ time

const B = (beat) => beat * 60 / BPM;
const DUR = B(BEATS);
const ramp = (t, b0, b1) => clamp((t - B(b0)) / (B(b1) - B(b0)));
const mix = (a, b, p) => a + (b - a) * p;
const E = {
  outQuad: (x) => 1 - (1 - x) * (1 - x),
  outCubic: (x) => 1 - (1 - x) ** 3,
  inCubic: (x) => x * x * x,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
};
// Springs: type has no overshoot, UI a hair, shapes a little more.
const TYPE = [600, 49], POP = [320, 24], SNAP = [480, 38];
const sp = (t, beat, [k, d] = POP) => spring(t - B(beat), k, d);
// A value with several targets: one spring per change, summed. keys: [[beat, value, k?, d?]]
function tr(t, keys, k0 = 170, d0 = 26) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [b, val, k = k0, d = d0] = keys[i];
    v += (val - keys[i - 1][1]) * spring(t - B(b), k, d);
  }
  return v;
}
const pulse = (t, beat, w = 0.08) => Math.exp(-(((t - B(beat)) / w) ** 2)); // a click's dip
// Seeded hash, never Math.random.
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------------------------------------------------------------- camera

// One camera for the whole film, so a scene change can never jump. Screen
// position = (world - centre) * scale + frame centre. No rotation. The
// marketplace lives 2200 px above the opening, so getting there is a whip.
const Y0 = -2200;
let cam = { cx: 540, cy: 960, s: 1 };
// Where the camera starts and ends: close on the Hamburg terminal. The film
// opens there and flies back into it at the end, so the loop is seamless.
const CAM_HOME = { cx: 196, cy: 360, s: 2.3 };

/** The opening's camera: macro on Hamburg, then it rides down the line with
 * the head, back up with it, and pulls back to the whole loop by beat 7. */
function openingCam(t) {
  // the head, smoothed over the last ~0.12 s so the camera trails it softly
  let hy = 0;
  for (let i = 0; i < 7; i++) hy += loopHeadY(Math.max(0, t - i * 0.02));
  hy /= 7;
  const s = tr(t, [[0, CAM_HOME.s], [0.3, 1.4, 70, 15], [1.6, 1.13, 50, 14], [4.0, 1.0, 30, 11]]);
  const cx = tr(t, [[0, CAM_HOME.cx], [0.3, 470, 70, 15], [4.0, 540, 30, 11]]);
  // the head rides in the lower third, so the words it leaves stay in frame
  const lead = 270 * E.inOutSine(ramp(t, 0.15, 0.9));
  const cy = mix(hy - lead, 950, E.inOutCubic(ramp(t, 4.6, 7.0)));
  return { cx, cy, s };
}

function camAt(t) {
  const baseCy = tr(t, [[0, 950], [EV.morph, 960, 120, 22], [EV.whipUp, 960 + Y0, 190, 27], [EV.whipDown, 960, 190, 27]]);
  const a = (b0, b1) => E.inOutSine(ramp(t, b0, b1));
  // a slow push that never stops, so no frame is ever still
  let baseS = 1 + 0.03 * a(9.5, 15.5) - 0.03 * a(15.9, 16.6)
    + 0.025 * a(16.6, 19.5) - 0.025 * a(19.65, 20.4)
    + 0.06 * E.inOutCubic(ramp(t, 21, 24)) - 0.06 * E.outCubic(ramp(t, 24, 26))
    + 0.03 * a(25.6, 31.3) - 0.03 * a(42.6, 44.8)
    + 0.04 * a(46.5, 54.3) - 0.04 * a(54.3, 55.2) + 0.05 * a(57, 63);
  // the drop punches in
  const dd = t - B(EV.drop);
  if (dd > 0) baseS *= 1 + 0.05 * (1 - Math.exp(-dd * 22)) * Math.exp(-dd * 5);
  // the opening camera hands over to the film's camera between beats 7 and 8
  const O = openingCam(Math.min(t, B(8)));
  const w = 1 - E.inOutSine(ramp(t, 7, 8));
  let cx = mix(540, O.cx, w), cy = mix(baseCy, O.cy, w), s = mix(baseS, O.s, w);
  // weeks ahead: down to the tender card under the row, and back up for "all planned"
  const cardView = E.inOutCubic(ramp(t, EV.tender - 0.1, EV.tender + 0.8)) - E.inOutCubic(ramp(t, EV.cardAway, EV.allFull - 0.05));
  cy += 240 * cardView; s *= 1 - 0.1 * cardView;
  // home: the camera flies back into the terminal it started on
  const hz = E.inOutCubic(ramp(t, EV.home + 0.2, BEATS));
  cx = mix(cx, CAM_HOME.cx, hz); cy = mix(cy, CAM_HOME.cy, hz); s = mix(s, CAM_HOME.s, hz);
  // impacts: München, and a nudge on each slammed word
  let shake = 0;
  for (const [b, amp] of [[EV.arriveM, 12], [EV.voll, 5], [EV.hin, 5], [EV.words2, 4], [EV.words2 + 0.2, 4], [EV.allFull, 9], [EV.allFull + 0.25, 4]]) {
    const dt = t - B(b);
    if (dt > 0) shake += amp * Math.exp(-dt * 11) * Math.sin(dt * 55);
  }
  return { cx, cy: cy + shake, s };
}
const toScreen = (x, y) => [W / 2 + (x - cam.cx) * cam.s, H / 2 + (y - cam.cy) * cam.s];
const worldT = () => g.setTransform(cam.s, 0, 0, cam.s, W / 2 - cam.cx * cam.s, H / 2 - cam.cy * cam.s);
const screenT = () => g.setTransform(1, 0, 0, 1, 0, 0);

// ------------------------------------------------------------ background

// Static film grain from a seeded hash: it also dithers the dark gradients,
// which band badly in H.264 otherwise.
const grain = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), img = x.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) {
    const v = Math.floor(hash(i) * 255);
    img.data.set([v, v, v, 255], i * 4);
  }
  x.putImageData(img, 0, 0);
  return main.createPattern(c, 'repeat');
})();

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function background(t) {
  screenT();
  g.fillStyle = C.bg;
  g.fillRect(0, 0, W, H);
  // light for the glass to bend. Every drift is a whole number of cycles over
  // the film, so the last frame matches the first and the film loops.
  const w = (2 * Math.PI) / DUR;
  const blobs = [
    [C.indigo, 0.30, 900, 760 + 110 * Math.sin(w * t), 520 + 90 * Math.cos(w * t)],
    [C.cyan, 0.13, 720, 250 + 90 * Math.sin(2 * w * t + 1), 1320 + 110 * Math.cos(w * t)],
    [C.indigo, 0.13, 640, 640 + 70 * Math.cos(w * t), 1800 + 60 * Math.sin(2 * w * t)],
  ];
  for (const [col, a, r, x, y] of blobs) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, hexA(col, a));
    gr.addColorStop(1, hexA(col, 0));
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  }
  // the website's grid, in the world at half parallax: it shows the camera move
  const step = 90;
  const ox = ((-(cam.cx * cam.s) * 0.5) % step + step) % step, oy = ((-(cam.cy * cam.s) * 0.5) % step + step) % step;
  g.strokeStyle = 'rgba(0,212,255,0.035)';
  g.lineWidth = 1.5;
  g.beginPath();
  for (let x = ox - step; x < W + step; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = oy - step; y < H + step; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
}

function finish() {
  screenT();
  // vignette keeps the eye in the middle third
  const v = g.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.48, H * 0.75);
  v.addColorStop(0, 'rgba(3,5,10,0)');
  v.addColorStop(1, 'rgba(3,5,10,0.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.045;
  g.globalCompositeOperation = 'overlay';
  g.fillStyle = grain;
  g.fillRect(0, 0, W, H);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}

/**
 * Motion blur that follows the camera: on a whip the finished frame is
 * averaged along the direction of travel, over the distance a 180° shutter
 * would see.
 */
function cameraSmear(t) {
  const a = camAt(t), b = camAt(t - 1 / 240);
  const v = (a.cy - b.cy) * a.s * 4; // px per 1/60 s
  const len = Math.abs(v) * 0.5;
  if (len < 4) return;
  const n = Math.min(28, Math.ceil(len / 4));
  smg.setTransform(1, 0, 0, 1, 0, 0);
  smg.clearRect(0, 0, W, H);
  smg.drawImage(canvas, 0, 0);
  g.save();
  screenT();
  g.fillStyle = C.bg;
  g.fillRect(0, 0, W, H);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 1 / (i + 1); // running mean: every copy weighs the same
    g.drawImage(smearBuf, 0, (i / (n - 1) - 0.5) * len);
  }
  g.restore();
}

// ----------------------------------------------------------------- glass

/**
 * Frosted glass over whatever is already drawn: a blurred, brightened and
 * slightly magnified copy of the pixels behind, clipped to the shape, with a
 * sheen and a rim light. Rect in world units.
 */
function glass(x, y, w, h, r, { blur = 28, tint = 0.06, rim = 0.55, magnify = 1.07, fill = null, alpha = 1, shadow = 0.55 } = {}) {
  const [sx, sy] = toScreen(x, y);
  const sw = w * cam.s, sh = h * cam.s, sr = Math.max(0, Math.min(r * cam.s, sw / 2, sh / 2));
  if (sw < 2 || sh < 2 || alpha <= 0) return;
  if (sx > W || sy > H || sx + sw < 0 || sy + sh < 0) return;
  screenT();
  if (shadow > 0) {
    // drawn far off-frame with the shadow offset back into place, so only the
    // shadow lands — the shape itself would hide what the glass should show
    g.save();
    g.shadowColor = `rgba(0,0,0,${shadow * alpha})`;
    g.shadowBlur = 70;
    g.shadowOffsetX = 10000;
    g.shadowOffsetY = 34;
    g.beginPath(); g.roundRect(sx - 10000, sy, sw, sh, sr);
    g.fillStyle = '#000'; g.fill();
    g.restore();
  }
  const m = blur * 2 + 24;
  const bx = Math.max(0, Math.floor(sx - m)), by = Math.max(0, Math.floor(sy - m));
  const bx1 = Math.min(W, Math.ceil(sx + sw + m)), by1 = Math.min(H, Math.ceil(sy + sh + m));
  if (bx1 > bx && by1 > by) {
    sg.setTransform(1, 0, 0, 1, 0, 0);
    sg.clearRect(bx, by, bx1 - bx, by1 - by);
    sg.drawImage(glassSrc ?? g.canvas, bx, by, bx1 - bx, by1 - by, bx, by, bx1 - bx, by1 - by);
    g.save();
    g.globalAlpha = alpha;
    g.beginPath(); g.roundRect(sx, sy, sw, sh, sr); g.clip();
    g.filter = `blur(${blur}px) saturate(1.7) brightness(1.4)`;
    const cx = sx + sw / 2, cy = sy + sh / 2;
    g.translate(cx, cy); g.scale(magnify, magnify); g.translate(-cx, -cy);
    g.drawImage(scratch, bx, by, bx1 - bx, by1 - by, bx, by, bx1 - bx, by1 - by);
    g.filter = 'none';
    screenT();
    const sheen = g.createLinearGradient(0, sy, 0, sy + sh);
    sheen.addColorStop(0, `rgba(255,255,255,${tint + 0.05})`);
    sheen.addColorStop(0.35, `rgba(255,255,255,${tint})`);
    sheen.addColorStop(1, `rgba(255,255,255,${tint * 0.5})`);
    g.fillStyle = sheen;
    g.fillRect(sx, sy, sw, sh);
    if (fill) { g.fillStyle = fill; g.fillRect(sx, sy, sw, sh); }
    g.restore();
  }
  // rim light: bright on the top-left edge, almost gone bottom-right
  g.save();
  g.globalAlpha = alpha;
  const rg = g.createLinearGradient(sx, sy, sx + sw * 0.5, sy + sh);
  rg.addColorStop(0, `rgba(255,255,255,${rim})`);
  rg.addColorStop(0.45, `rgba(255,255,255,${rim * 0.12})`);
  rg.addColorStop(1, `rgba(255,255,255,${rim * 0.3})`);
  g.beginPath(); g.roundRect(sx + 1, sy + 1, Math.max(0, sw - 2), Math.max(0, sh - 2), Math.max(0, sr - 1));
  g.lineWidth = 2; g.strokeStyle = rg; g.stroke();
  g.restore();
}

// ---------------------------------------------------------------- effects

/**
 * A shockwave through the finished frame: an expanding ring that pushes the
 * pixels under it outwards like a lens, with a faint rim of light. Screen px.
 */
function shockwave(sx, sy, r, width, strength) {
  if (strength < 0.01 || r <= 0) return;
  smg.setTransform(1, 0, 0, 1, 0, 0);
  smg.clearRect(0, 0, W, H);
  smg.drawImage(canvas, 0, 0);
  const bands = 7;
  g.save();
  screenT();
  for (let i = 0; i < bands; i++) {
    const r0 = Math.max(0, r - width + (2 * width) * (i / bands)), r1 = r - width + (2 * width) * ((i + 1) / bands);
    if (r1 <= 0) continue;
    const prof = Math.sin(Math.PI * (i + 0.5) / bands);
    const k = 1 + (strength * width * prof) / Math.max(40, (r0 + r1) / 2);
    g.save();
    g.beginPath(); g.arc(sx, sy, r1, 0, Math.PI * 2); g.arc(sx, sy, r0, 0, Math.PI * 2, true); g.clip();
    g.translate(sx, sy); g.scale(k, k); g.translate(-sx, -sy);
    g.drawImage(smearBuf, 0, 0);
    g.restore();
  }
  g.beginPath(); g.arc(sx, sy, r, 0, Math.PI * 2);
  g.strokeStyle = `rgba(255,255,255,${0.22 * Math.min(1, strength)})`; g.lineWidth = 2; g.stroke();
  g.restore();
}

/** Chromatic split: red left, blue right, by `amount` screen px. */
function rgbSplit(amount, dir = [1, 0]) {
  if (amount < 0.4) return;
  smg.setTransform(1, 0, 0, 1, 0, 0);
  smg.clearRect(0, 0, W, H);
  smg.drawImage(canvas, 0, 0);
  g.save();
  screenT();
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  for (const [col, k] of [['#ff0000', -1], ['#00ff00', 0], ['#0000ff', 1]]) {
    tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.globalCompositeOperation = 'source-over';
    tg.clearRect(0, 0, W, H);
    tg.drawImage(smearBuf, 0, 0);
    tg.globalCompositeOperation = 'multiply';
    tg.fillStyle = col; tg.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    g.drawImage(tmpBuf, dir[0] * k * amount, dir[1] * k * amount);
  }
  g.restore();
}

/** A burst of light at a world point, added on top. */
function flash(x, y, color, alpha, radius) {
  if (alpha < 0.01) return;
  g.save();
  worldT();
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 0, x, y, radius);
  gr.addColorStop(0, hexA(color, alpha));
  gr.addColorStop(0.35, hexA(color, alpha * 0.35));
  gr.addColorStop(1, hexA(color, 0));
  g.fillStyle = gr;
  g.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  g.restore();
}

/** A one-shot envelope: up in `attack` s (never in one frame), then decaying. */
const hit = (t, beat, decay = 8, attack = 0.035) => {
  const dt = t - B(beat);
  return dt <= 0 ? 0 : Math.min(1, dt / attack) * Math.exp(-dt * decay);
};

/** Speed streaks on a whip, scrolling with the camera. */
function speedLines(t) {
  const a = camAt(t), b = camAt(t - 1 / 240);
  const v = (a.cy - b.cy) * a.s * 4; // px per frame
  const k = clamp((Math.abs(v) - 20) / 90);
  if (k <= 0) return;
  g.save();
  screenT();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) {
    const x = hash(i * 3.1) * W;
    const len = Math.abs(v) * (2 + 3 * hash(i * 7.7));
    const y = ((hash(i * 5.3) * (H + 800) - a.cy * a.s * (1.2 + hash(i) * 0.8)) % (H + 800) + (H + 800)) % (H + 800) - 400;
    const gr = g.createLinearGradient(0, y, 0, y + len * Math.sign(v || 1));
    const col = i % 5 === 0 ? '0,212,255' : '220,235,255';
    gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.5, `rgba(${col},${0.35 * k})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.strokeStyle = gr; g.lineWidth = 1 + 2 * hash(i * 1.9);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + len * Math.sign(v || 1)); g.stroke();
  }
  g.restore();
}

/** The glowing head of a moving line: white core, coloured bloom. World coords. */
function comet(x, y, color, size = 1) {
  g.save();
  worldT();
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 0, x, y, 90 * size);
  gr.addColorStop(0, hexA(color, 0.75)); gr.addColorStop(0.25, hexA(color, 0.25)); gr.addColorStop(1, hexA(color, 0));
  g.fillStyle = gr; g.fillRect(x - 90 * size, y - 90 * size, 180 * size, 180 * size);
  g.globalCompositeOperation = 'source-over';
  g.beginPath(); g.arc(x, y, 9 * size, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
  g.restore();
}

/**
 * Sparks thrown off a moving point: two are born every frame from where the
 * point was, fly out on a seeded velocity and burn out. `pos(t)` gives the
 * point; sparks are only born between `from` and `to` (seconds).
 */
function sparks(t, pos, from, to, color, { life = 0.42, speed = 1, count = 2 } = {}) {
  const now = Math.floor(t * 60);
  g.save();
  worldT();
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < Math.ceil(life * 60); k++) {
    for (let j = 0; j < count; j++) {
      const id = (now - k) * count + j;
      const tb = (now - k) / 60;
      if (tb < from || tb > to) continue;
      const age = t - tb;
      if (age < 0 || age > life) continue;
      const [bx, by] = pos(tb);
      const ang = hash(id * 1.37) * Math.PI * 2, sp0 = (60 + 220 * hash(id * 2.71)) * speed;
      const drag = age * (1 - age / (life * 2));
      const x = bx + Math.cos(ang) * sp0 * drag, y = by + Math.sin(ang) * sp0 * drag + 90 * age * age;
      const f = 1 - age / life;
      g.beginPath(); g.arc(x, y, (1.2 + 2.4 * hash(id * 3.3)) * f / cam.s * 1.4, 0, Math.PI * 2);
      g.fillStyle = hexA(j % 3 === 0 ? '#ffffff' : color, 0.9 * f);
      g.fill();
    }
  }
  g.restore();
}

/**
 * A panel swinging in in 3D: drawn flat into a layer (its glass still frosts
 * the real frame), then laid back into the frame strip by strip with
 * perspective, tilted `tilt` radians about its horizontal axis.
 */
function panel3D(drawFn, rect, tilt) {
  if (Math.abs(tilt) < 0.004) { drawFn(); return; }
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.clearRect(0, 0, W, H);
  const prev = g; g = lg; glassSrc = canvas;
  drawFn();
  g = prev; glassSrc = null;
  const [x0, y0] = toScreen(rect[0], rect[1]);
  const w = rect[2] * cam.s, h = rect[3] * cam.s;
  const cx = x0 + w / 2, cy = y0 + h / 2;
  const F = 1500, step = 3;
  const pad = 70; // shadow and rim reach a little outside the rect
  g.save();
  screenT();
  for (let y = y0 - pad; y < y0 + h + pad; y += step) {
    const dy = y - cy;
    const z = dy * Math.sin(tilt);
    const k = F / (F + z);
    const yy = cy + dy * Math.cos(tilt) * k;
    const ww = (w + 2 * pad) * k;
    g.drawImage(layer, x0 - pad, y, w + 2 * pad, step, cx - ww / 2, yy, ww, step * Math.cos(tilt) * k + 1);
  }
  g.restore();
}

/** Where a point is along a rounded rect's outline, clockwise from the top-left, p in 0..1. */
function rrectPoint(x, y, w, h, r, p) {
  const sides = [w - 2 * r, h - 2 * r, w - 2 * r, h - 2 * r], arc = Math.PI * r / 2;
  const perim = sides.reduce((a, b) => a + b, 0) + 4 * arc;
  let d = ((p % 1) + 1) % 1 * perim;
  const corners = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  const starts = [[x + r, y, 1, 0], [x + w, y + r, 0, 1], [x + w - r, y + h, -1, 0], [x, y + h - r, 0, -1]];
  for (let i = 0; i < 4; i++) {
    if (d <= sides[i]) return [starts[i][0] + starts[i][2] * d, starts[i][1] + starts[i][3] * d];
    d -= sides[i];
    if (d <= arc) { const [cx, cy, a0] = corners[i]; const a = a0 + d / r; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }
    d -= arc;
  }
  return [x + r, y];
}

/** An outline that draws itself with a bright, glowing head running ahead of it. */
function energyOutline(x, y, w, h, r, p, color, width = 4) {
  if (p <= 0) return;
  outlineSweep(x, y, w, h, r, Math.min(1, p), color, width);
  if (p >= 1) return;
  const [hx, hy] = rrectPoint(x, y, w, h, r, p);
  comet(hx, hy, color, 0.7);
}

/** A rounded-rect outline that draws itself clockwise from the top-left. */
function outlineSweep(x, y, w, h, r, p, color, width = 3) {
  if (p <= 0) return;
  g.save();
  worldT();
  const perim = 2 * (w + h) - (8 - 2 * Math.PI) * r;
  g.beginPath(); g.roundRect(x, y, w, h, r);
  g.setLineDash([perim * p, perim]);
  g.lineWidth = width; g.strokeStyle = color; g.stroke();
  g.restore();
}

// ------------------------------------------------------------ typography

/**
 * One line of type rising out of its own slot (a mask, never a fade), and
 * optionally leaving upwards. `stroke` > 0 draws it hollow: empty type.
 */
function rise(t, text, x, y, { beat, size, fam = D, weight = '', color = C.ink, align = 'left', stroke = 0, out = null, dx = 0, smear = 0, spacing = 0, glow = null }) {
  const p = spring(t - B(beat), ...TYPE);
  if (p <= 0) return;
  const po = out == null ? 0 : spring(t - B(out), ...SNAP);
  if (po >= 0.999) return;
  g.save();
  worldT();
  g.font = font(size, fam, weight);
  g.letterSpacing = `${spacing}px`;
  g.textAlign = align;
  g.textBaseline = 'alphabetic';
  const m = g.measureText(text);
  const x0 = align === 'left' ? x : align === 'right' ? x - m.width : x - m.width / 2;
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  g.beginPath();
  g.rect(x0 - size * 0.3 + dx - Math.abs(smear), y - asc - size * 0.06, m.width + size * 0.6 + Math.abs(smear) * 2, asc + desc + size * 0.12);
  g.clip();
  const ty = y + (1 - p) * (asc + size * 0.1) - po * (asc + desc + size * 0.3);
  if (glow) { g.shadowColor = glow; g.shadowBlur = 22; }
  paintText(text, x + dx, ty, color, stroke, smear);
  g.restore();
}

/** Text with an optional horizontal smear (motion blur that follows speed). */
function paintText(text, x, y, color, stroke = 0, smear = 0) {
  const n = Math.abs(smear) > 2 ? 9 : 1;
  for (let i = 0; i < n; i++) {
    const k = n === 1 ? 0 : i / (n - 1);
    g.globalAlpha = n === 1 ? 1 : Math.min(1, 1.8 / n);
    if (stroke) { g.lineWidth = stroke; g.lineJoin = 'round'; g.strokeStyle = color; g.strokeText(text, x - smear * k, y); }
    else { g.fillStyle = color; g.fillText(text, x - smear * k, y); }
  }
  g.globalAlpha = 1;
}

function fitSize(text, width, max, fam = D, weight = '') {
  g.font = font(max, fam, weight);
  const w = g.measureText(text).width;
  return w > width ? Math.floor(max * width / w) : max;
}

const uiText = (t, text, x, y, beat, size, color = C.text, weight = 500, align = 'left', out = null) =>
  rise(t, text, x, y, { beat, size, fam: UI, weight, color, align, out });

// ---------------------------------------------------------------- the loop

// The film's one line, in local units (1 unit = 1 px in the opening pose):
// down the left leg from Hamburg, round the turn in München, back up the
// right leg. Solid = loaded, hollow = empty. The legs' spacing and length are
// part of the pose: the loop spreads its legs as it lies down in the card,
// and rolls itself up into Hamburg before the network.
const TOP = -590, ARC_Y = 542;
const geo = (leg, len = 1) => {
  const L1 = (ARC_Y - TOP) * len, LA = Math.PI * leg;
  return { leg, L1, LA, arcY: TOP + L1, S_M: L1 + LA / 2, LTOT: 2 * L1 + LA };
};

function loopPoint(s, G) {
  if (s <= G.L1) return [-G.leg, TOP + s, 0, 1];
  if (s <= G.L1 + G.LA) {
    const th = Math.PI - (s - G.L1) / G.leg;
    return [G.leg * Math.cos(th), G.arcY + G.leg * Math.sin(th), Math.sin(th), -Math.cos(th)];
  }
  return [G.leg, G.arcY - (s - G.L1 - G.LA), 0, -1];
}

function loopPath(G, s0, s1, offset = 0) {
  g.beginPath();
  const n = Math.max(2, Math.ceil((s1 - s0) / 8));
  for (let i = 0; i <= n; i++) {
    const [x, y, tx, ty] = loopPoint(s0 + (s1 - s0) * (i / n), G);
    const px = x - ty * offset, py = y + tx * offset;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
}

// How far the line has come, as fractions: out to München by beat 3, back by beat 7.
const loopOut = (t) => E.outQuad(ramp(t, EV.launch, EV.arriveM));
const loopBack = (t) => E.inOutCubic(ramp(t, EV.turn, EV.arriveH));
function loopHeadY(t) {
  const G = geo(48);
  const s = loopBack(t) > 0 ? G.S_M + loopBack(t) * (G.LTOT - G.S_M) : loopOut(t) * G.S_M;
  return 950 + loopPoint(s, G)[1];
}

const POSE_OPEN = { x: 176, y: 950, rot: 0, s: 1, leg: 48, len: 1 };
const POSE_CARD = { x: 542, y: 1120, rot: -Math.PI / 2, s: 0.38, leg: 92, len: 1 };
const poseMix = (a, b, pp, pr, ps) => ({
  x: mix(a.x, b.x, pp), y: mix(a.y, b.y, pp), rot: mix(a.rot, b.rot, pr), s: mix(a.s, b.s, ps),
  leg: mix(a.leg, b.leg, ps), len: mix(a.len ?? 1, b.len ?? 1, ps),
});
const poseApply = (pose, [x, y]) => {
  const c = Math.cos(pose.rot), s = Math.sin(pose.rot);
  return [pose.x + (x * c - y * s) * pose.s, pose.y + (x * s + y * c) * pose.s];
};
/** The liquid level (world y) for a fill fraction, in a pose that stands upright. */
const fillLevel = (pose, f) => { const G = geo(pose.leg, pose.len); return poseApply(pose, loopPoint(G.S_M + f * (G.LTOT - G.S_M), G))[1]; };

/**
 * Draw the loop. out / back / fill are fractions of each leg. Widths are in
 * screen pixels so the line reads at any pose. hk: 1 = Hamburg is a terminal
 * spanning both legs, 0 = just a stop at the end of the way back (in the
 * marketplace only the way back exists). flow: freight moving, after the drop.
 */
function drawLoop(pose, { out = 0, back = 0, fill = 0, tube = 20, stationM = 1, stationH = 1, hk = 1, flow = 0, t = 0, glow = 0, bubbles = null }) {
  const G = geo(pose.leg, pose.len ?? 1);
  g.save();
  worldT();
  g.translate(pose.x, pose.y); g.rotate(pose.rot); g.scale(pose.s, pose.s);
  const k = 1 / (pose.s * cam.s);
  const T = tube * k, R = Math.max(2.2, tube * 0.18) * k;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const backLen = G.LTOT - G.S_M;
  if (back > 0.0005) {
    // the empty way back: the same tube, hollow
    const s1 = G.S_M + back * backLen;
    g.strokeStyle = C.amber; g.lineWidth = R;
    if (glow) { g.shadowColor = C.amber; g.shadowBlur = 12 * glow; }
    for (const o of [-(T - R) / 2, (T - R) / 2]) { loopPath(G, G.S_M, s1, o); g.stroke(); }
    const [x, y, tx, ty] = loopPoint(s1, G);
    const a = Math.atan2(ty, tx);
    g.beginPath(); g.arc(x, y, (T - R) / 2, a - Math.PI / 2, a + Math.PI / 2); g.stroke();
  }
  g.shadowBlur = 0;
  if (fill > 0.0005) {
    g.strokeStyle = C.green; g.lineWidth = T;
    if (glow) { g.shadowColor = C.green; g.shadowBlur = 30 * glow; }
    loopPath(G, G.S_M, G.S_M + fill * backLen); g.stroke();
    g.shadowBlur = 0;
    if (bubbles != null && fill < 0.999) {
      // bubbles rising through the liquid, and a bright front where it climbs
      const L = fill * backLen;
      for (let i = 0; i < 16; i++) {
        const sb = G.S_M + ((hash(i * 4.1) * L + bubbles * (160 + 120 * hash(i))) % L);
        const [bx, by, tx, ty] = loopPoint(sb, G);
        const off = (hash(i * 2.3) - 0.5) * T * 0.5;
        g.beginPath(); g.arc(bx - ty * off, by + tx * off, (1.4 + 2.2 * hash(i * 9.1)) * k, 0, Math.PI * 2);
        g.fillStyle = 'rgba(255,255,255,0.6)'; g.fill();
      }
      const [fx, fy] = loopPoint(G.S_M + L, G);
      g.globalCompositeOperation = 'lighter';
      const gr = g.createRadialGradient(fx, fy, 0, fx, fy, 70 * k);
      gr.addColorStop(0, 'rgba(220,255,240,0.95)'); gr.addColorStop(0.3, 'rgba(0,255,157,0.35)'); gr.addColorStop(1, 'rgba(0,255,157,0)');
      g.fillStyle = gr; g.fillRect(fx - 70 * k, fy - 70 * k, 140 * k, 140 * k);
      g.globalCompositeOperation = 'source-over';
    }
  }
  if (out > 0.0005) {
    g.strokeStyle = C.cyan; g.lineWidth = T;
    if (glow) { g.shadowColor = C.cyan; g.shadowBlur = 30 * glow; }
    loopPath(G, 0, out * G.S_M); g.stroke();
    g.shadowBlur = 0;
  }
  if (flow > 0) {
    // freight moving round the full loop: bright dashes travelling with it
    g.setLineDash([34 * k, 190 * k]);
    g.lineDashOffset = -t * 520;
    g.strokeStyle = `rgba(255,255,255,${0.45 * flow})`; g.lineWidth = T * 0.36;
    loopPath(G, 0, G.S_M + fill * backLen); g.stroke();
    g.setLineDash([]);
  }
  // stations, metro-map style
  if (stationM > 0) {
    const [mx, my] = loopPoint(G.S_M, G);
    g.beginPath(); g.arc(mx, my, 25 * k * stationM, 0, Math.PI * 2); g.fillStyle = C.ink; g.fill();
    g.beginPath(); g.arc(mx, my, 9 * k * stationM, 0, Math.PI * 2); g.fillStyle = C.bg; g.fill();
  }
  if (stationH > 0) {
    const x0 = G.leg - 2 * G.leg * hk;
    g.lineWidth = 48 * k * stationH; g.strokeStyle = C.ink;
    g.beginPath(); g.moveTo(x0, TOP); g.lineTo(G.leg, TOP); g.stroke();
    g.lineWidth = 16 * k * stationH; g.strokeStyle = C.bg;
    g.beginPath(); g.moveTo(x0, TOP); g.lineTo(G.leg, TOP); g.stroke();
  }
  g.restore();
}

/** Station names. They never rotate; they slide from beside the nodes in the
 * opening (p = 0) to the ends of the route in the card (p = 1). */
function stationLabels(t, pose, p, { appearH = -1, appearM = EV.arriveM, out = null } = {}) {
  const hamb = poseApply(pose, [0, TOP]);
  const mun = poseApply(pose, [0, ARC_Y + pose.leg]);
  const sz = mix(34, 26, p);
  g.save();
  worldT();
  g.font = font(sz, UI, 600);
  g.letterSpacing = `${mix(6, 3, p)}px`;
  const wH = g.measureText('HAMBURG').width;
  g.restore();
  const hx = mix(hamb[0] - 70, hamb[0] - 48 - wH, p), hy = mix(hamb[1] - 60, hamb[1] + sz * 0.36, p);
  const mx = mix(mun[0] - 72, mun[0] + 48, p), my = mix(mun[1] + 84, mun[1] + sz * 0.36, p);
  rise(t, 'HAMBURG', hx, hy, { beat: appearH, size: sz, fam: UI, weight: 600, color: C.muted, spacing: mix(6, 3, p), out });
  rise(t, 'MÜNCHEN', mx, my, { beat: appearM, size: sz, fam: UI, weight: 600, color: C.muted, spacing: mix(6, 3, p), out });
}

/** An expanding ring where something lands. */
function burst(t, x, y, beat, color = C.ink, r0 = 26, r1 = 120) {
  const dt = t - B(beat);
  if (dt < 0 || dt > 0.4) return;
  const p = 1 - Math.exp(-dt * 9);
  g.save();
  worldT();
  g.beginPath(); g.arc(x, y, mix(r0, r1, p), 0, Math.PI * 2);
  g.strokeStyle = hexA(color, 0.9 * (1 - dt / 0.4));
  g.lineWidth = mix(14, 2, p) * Math.min(1, dt * 30);
  g.stroke();
  g.restore();
}

// ------------------------------------------------------------- the words

// VOLL HIN. / LEER ZURÜCK. beside the line. Solid type for the loaded leg,
// hollow type for the empty one.
const WORDS = (() => {
  // right edge at 940: TikTok's buttons sit over the last ~140 px
  const x = 316, width = 940 - x;
  const size = fitSize('ZURÜCK.', width, 400);
  const lh = size * 0.86;
  const top = 950 - (lh * 4) / 2;
  return { x, size, lh, top, base: (i) => top + (i + 1) * lh - size * 0.08 };
})();

function words(t, { beats = [EV.voll, EV.hin, EV.leer, EV.zurueck], exit = null, out = null, rolled = null, level = Infinity, shine = null, hero = false, wave = 0 } = {}) {
  const lines = [['VOLL', 'solid'], ['HIN.', 'solid'], ['LEER', 'hollow'], ['ZURÜCK.', 'hollow']];
  lines.forEach(([text, kind], i) => {
    // leaving sideways: pushed off to the right, accelerating, blurred by its own speed
    let dx = 0, smear = 0;
    if (exit != null) {
      const a = ramp(t, exit + i * 0.09, exit + 0.75 + i * 0.09);
      dx = 1150 * E.inCubic(a);
      smear = 1150 * (E.inCubic(Math.min(1, a + 0.06)) - E.inCubic(a)) * 1.2;
    }
    const y = WORDS.base(i);
    const o = out == null ? null : out + i * 0.06;
    const fresh = (dur) => hero && exit == null && o == null && t < B(beats[i]) + dur;
    if (kind === 'solid') {
      if (fresh(0.4)) slamWord(t, text, WORDS.x, y, beats[i], WORDS.size, C.ink);
      else rise(t, text, WORDS.x, y, { beat: beats[i], size: WORDS.size, color: C.ink, dx, smear, out: o });
    } else if (i === 2 && rolled != null && t >= B(rolled) - 0.001) {
      rollWord(t, 'LEER', 'VOLL', WORDS.x + dx, y, WORDS.size, rolled, level, o);
    } else {
      const full = level < y - WORDS.size * 0.75;
      const col = full ? C.green : C.amber;
      if (fresh(0.75)) neonWord(t, text, WORDS.x, y, beats[i], WORDS.size, col);
      else rise(t, text, WORDS.x, y, { beat: beats[i], size: WORDS.size, color: col, stroke: 4, dx, smear, out: o, glow: hero ? col : null });
      if (level < y && (o == null || t < B(o))) fillBelow(text, WORDS.x + dx, y, WORDS.size, level, C.green, t, wave);
      else if (level < y && o != null) rise(t, text, WORDS.x, y, { beat: beats[i], size: WORDS.size, color: C.green, out: o });
    }
  });
  if (shine != null) shineSweep(t, shine);
}

/** The part of a hollow word below a liquid level, filled solid. While it
 * fills, the surface sloshes. */
function fillBelow(text, x, y, size, level, color, t = 0, wave = 0) {
  g.save();
  worldT();
  g.font = font(size);
  g.beginPath();
  const x0 = x - 50, x1 = x + size * 6;
  g.moveTo(x0, y + size);
  for (let xx = x0; xx <= x1; xx += 10) g.lineTo(xx, level + wave * (Math.sin(xx * 0.018 + t * 9) + 0.5 * Math.sin(xx * 0.043 - t * 6)));
  g.lineTo(x1, y + size); g.closePath(); g.clip();
  g.fillStyle = color;
  g.fillText(text, x, y);
  g.lineWidth = 4; g.strokeStyle = color; g.strokeText(text, x, y);
  g.restore();
}

/** A full word slamming in: from big and blurred by its speed to its place,
 * landing with a white flash on the letters. */
function slamWord(t, text, x, y, beat, size, color) {
  const dt = t - B(beat);
  if (dt < 0) return;
  const p = spring(dt, 420, 26);
  const sc = mix(1.45, 1, p);
  const blur = 18 * Math.max(0, 1 - dt / 0.1);
  g.save();
  worldT();
  g.font = font(size);
  const w = g.measureText(text).width;
  const cx = x + w * 0.35, cy = y - size * 0.35;
  g.translate(cx, cy); g.scale(sc, sc); g.translate(-cx, -cy);
  if (blur > 0.3) g.filter = `blur(${blur}px)`;
  g.fillStyle = color; g.fillText(text, x, y);
  g.filter = 'none';
  const fl = Math.exp(-dt * 14);
  if (fl > 0.02) { g.globalAlpha = 0.85 * fl; g.fillStyle = '#fff'; g.fillText(text, x, y); }
  g.restore();
}

/** An empty word tracing its own outline like a neon tube, then flickering
 * before it holds — empty, but lit. */
function neonWord(t, text, x, y, beat, size, color) {
  const dt = t - B(beat);
  if (dt < 0) return;
  const p = E.outCubic(clamp(dt / 0.42));
  const ft = dt - 0.42;
  const on = ft > 0 && ft < 0.3 ? (hash(Math.floor(t * 60) * 7.13 + beat) > 0.4 ? 1 : 0.2) : 1;
  g.save();
  worldT();
  g.font = font(size);
  g.lineJoin = 'round';
  g.setLineDash([2600 * p, 2600]);
  g.shadowColor = color; g.shadowBlur = 22 * on;
  g.globalAlpha = on;
  g.lineWidth = 4; g.strokeStyle = color;
  g.strokeText(text, x, y);
  g.restore();
}

/** On the drop, a highlight runs across the full words once: the type is
 * drawn again with a gradient that is clear except for one bright band. */
function shineSweep(t, beat) {
  const p = ramp(t, beat, beat + 1.1);
  if (p <= 0 || p >= 1) return;
  g.save();
  worldT();
  g.font = font(WORDS.size);
  const x = mix(WORDS.x - 400, 1300, E.inOutCubic(p));
  const gr = g.createLinearGradient(x - 160, WORDS.top, x + 40, WORDS.top + WORDS.lh * 4);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.7)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  ['VOLL', 'HIN.', 'VOLL', 'ZURÜCK.'].forEach((txt, i) => g.fillText(txt, WORDS.x, WORDS.base(i)));
  g.restore();
}

/**
 * LEER → VOLL, letter by letter like a split-flap: each old letter rolls up
 * out of its slot as the new one rolls in, and the slots slide to the new
 * word's spacing.
 */
function rollWord(t, from, to, x, y, size, rolled, level, out = null) {
  const po = out == null ? 0 : spring(t - B(out), ...SNAP);
  if (po >= 0.999) return;
  g.save();
  worldT();
  g.font = font(size);
  const adv = (word) => { const xs = []; let acc = 0; for (const ch of word) { xs.push(acc); acc += g.measureText(ch).width; } return xs; };
  const xa = adv(from), xb = adv(to);
  const asc = g.measureText('L').actualBoundingBoxAscent;
  const lift = po * (asc + size * 0.32);
  for (let i = 0; i < from.length; i++) {
    const p = spring(t - B(rolled + i * 0.25), 380, 30);
    const lx = x + mix(xa[i], xb[i], p);
    g.save();
    g.beginPath(); g.rect(lx - 10, y - asc - size * 0.18, size, asc + size * 0.26); g.clip();
    const travel = asc + size * 0.45;
    if (p < 0.97) {
      const yo = y - p * travel - lift;
      g.save();
      g.beginPath(); g.rect(lx - 10, level, size, size * 2); g.clip();
      g.fillStyle = C.green; g.fillText(from[i], lx, yo);
      g.restore();
      g.lineWidth = 4; g.strokeStyle = level < y ? C.green : C.amber; g.strokeText(from[i], lx, yo);
    }
    g.fillStyle = C.green;
    g.fillText(to[i], lx, y + Math.max(0, 1 - p) * travel - lift);
    g.restore();
  }
  g.restore();
}

/** Droplets thrown up out of a point, falling back under gravity. */
function splash(t, x, y, beat, color) {
  const dt = t - B(beat);
  if (dt < 0 || dt > 0.9) return;
  g.save();
  worldT();
  for (let i = 0; i < 30; i++) {
    const ang = -Math.PI / 2 + (hash(i * 3.7) - 0.5) * 2.3;
    const v = 420 + 720 * hash(i * 1.9);
    const px = x + Math.cos(ang) * v * dt, py = y + Math.sin(ang) * v * dt + 1500 * dt * dt;
    const f = 1 - dt / 0.9;
    g.beginPath(); g.arc(px, py, (3 + 6 * hash(i * 5.1)) * f, 0, Math.PI * 2);
    g.fillStyle = hexA(i % 4 === 0 ? '#eafff5' : color, f);
    g.fill();
  }
  g.restore();
}

// ------------------------------------------------------------------ cursor

/**
 * A macOS-style arrow with a name tag, like a multiplayer cursor: the
 * cursors in the film are different companies. It leans into its own motion,
 * grows on hover and dips on every click. keys: [[beat, [x, y]], ...]
 */
function cursorPos(t, keys) {
  const kx = keys.map(([b, p]) => [b, p[0], 110, 21]), ky = keys.map(([b, p]) => [b, p[1], 110, 21]);
  return [tr(t, kx), tr(t, ky)];
}
function cursor(t, { keys, pos = (tt) => cursorPos(tt, keys), clicks = [], hover = [], label, color, holds = [] }) {
  if (t < B(keys[0][0]) - 0.001) return;
  const [x, y] = pos(t);
  const [x0] = pos(t - 1 / 60);
  const lean = clamp((x - x0) * 60 / 2400, -0.35, 0.35);
  let scale = 1;
  for (const [b0, b1] of hover) scale += 0.22 * (sp(t, b0, POP) - sp(t, b1, POP));

function pill(x, y, h, text, { size = 26, color = C.amber, solid = false, weight = 700, spacing = 2, icon = null, scale = 1, align = 'left' } = {}) {
  g.save();
  worldT();

  g.letterSpacing = `${spacing}px`;
  const iw = icon ? size * 1.1 : 0;
  const w = g.measureText(text).width + size * 1.4 + iw;
  if (align === 'center') x -= w / 2;
  if (scale !== 1) { g.translate(x + w / 2, y + h / 2); g.scale(scale, scale); g.translate(-x - w / 2, -y - h / 2); }
  g.beginPath(); g.roundRect(x, y, w, h, h / 2);
  if (solid) { g.fillStyle = color; g.fill(); }
  else { g.fillStyle = hexA(color, 0.1); g.fill(); g.lineWidth = 2.5; g.strokeStyle = color; g.stroke(); }
  if (icon === 'warn') {
    const ix = x + size * 0.75, iy = y + h / 2;
    g.beginPath(); g.moveTo(ix, iy - size * 0.42); g.lineTo(ix + size * 0.46, iy + size * 0.36); g.lineTo(ix - size * 0.46, iy + size * 0.36); g.closePath();
    g.lineWidth = 2.5; g.lineJoin = 'round'; g.strokeStyle = solid ? C.bg : color; g.stroke();
    g.fillStyle = solid ? C.bg : color;
    g.fillRect(ix - 1.25, iy - size * 0.14, 2.5, size * 0.26);
    g.fillRect(ix - 1.25, iy + size * 0.17, 2.5, 2.5);

}

function button(x, y, w, h, text, { color = C.green, size = 34, scale = 1, textColor = C.bg, outline = false } = {}) {
  g.save();

  const cx = x + w / 2, cy = y + h / 2;

  else { g.fillStyle = color; g.fill(); }

  g.fillText(text, cx, cy + 2);
  g.restore();
}

/**
 * Odometer digits: each digit rolls continuously, a higher one only while the
 * lower one passes 9 → 0, so the price is a pure function of the value.
 */
function odometer(value, x, y, size, color, { prefix = '€', groups = true, unitZero = true, pad = 1 } = {}) {
  g.save();
  worldT();
  g.font = font(size);
  g.fillStyle = color;
  g.textBaseline = 'alphabetic';
  const dw = g.measureText('0').width;
  const asc = g.measureText('0').actualBoundingBoxAscent;
  let cx = x;
  g.fillText(prefix, cx, y); cx += g.measureText(prefix).width + size * 0.02;
  // value in tens (prices step by 10 here); the last digit is a fixed 0
  const v = unitZero ? value / 10 : value;
  const digits = Math.max(pad, Math.floor(Math.log10(Math.max(1, v))) + 1);
  for (let j = digits - 1; j >= 0; j--) {
    const p10 = 10 ** j;
    const d = Math.floor(v / p10);
    const frac = j === 0 ? v - Math.floor(v) : clamp((v % p10) - (p10 - 1));
    const a = ((d % 10) + 10) % 10, b = (a + 1) % 10;
    g.save();
    g.beginPath(); g.rect(cx - 4, y - asc - size * 0.08, dw + 8, asc + size * 0.16); g.clip();
    g.fillText(String(a), cx, y - frac * (asc + size * 0.12));
    if (frac > 0) g.fillText(String(b), cx, y + (1 - frac) * (asc + size * 0.12));
    g.restore();
    cx += dw;
    const totalDigits = digits + (unitZero ? 1 : 0);
    const posFromRight = j + (unitZero ? 1 : 0);
    if (groups && posFromRight === 3 && totalDigits > 3) { g.fillText('.', cx, y); cx += g.measureText('.').width; }
  }
  if (unitZero) { g.fillText('0', cx, y); cx += dw; }
  g.restore();
  return cx;
}

/** Draw fn into an offscreen copy of the frame, then composite it back with
 * blur / dim / scale: depth of field for whatever sits behind a panel. */
function withDepth(fn, { blur = 0, dim = 0, scale = 1, cx = W / 2, cy = H / 2 }) {
  lg.setTransform(1, 0, 0, 1, 0, 0);
  lg.clearRect(0, 0, W, H);
  lg.drawImage(canvas, 0, 0);
  const prev = g; g = lg;
  fn();
  g = prev;
  g.save();
  screenT();
  g.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
  const [sx, sy] = toScreen(cx, cy);
  g.translate(sx, sy); g.scale(scale, scale); g.translate(-sx, -sy);
  g.drawImage(layer, 0, 0);
  g.filter = 'none';
  g.restore();
  if (dim > 0) {
    g.save(); screenT();
    g.fillStyle = `rgba(3,5,10,${dim})`;
    g.fillRect(0, 0, W, H);
    g.restore();
  }
}

}

/**
 * The network seen in 3D: it arrives tilted back and turned, and swings round
 * to face you before the 24 h start. Returns a projector for world points.
 */
function netProj(t) {
  const e = spring(t - B(EV.hub + 0.2), 30, 9);
  const tilt = 1.0 * (1 - e), spin = -0.75 * (1 - e);
  const c = Math.cos(spin), s = Math.sin(spin), ct = Math.cos(tilt), st = Math.sin(tilt);
  return ([x, y]) => {
    const dx0 = x - NET.x, dy0 = y - NET.y;
    const dx = dx0 * c - dy0 * s, dy = dx0 * s + dy0 * c;
    const k = 1500 / (1500 + dy * st);
    return [NET.x + dx * k, NET.y + dy * ct * k, k];
  };
}

/** The partner graph. c > 0 pulls everything into the brand dot at the end. */
function networkGraph(t, c = 0) {
  const P = netProj(t);
  const at = (pt) => { const [x, y, k] = P(pt); return [mix(x, 540, c), mix(y, 900, c), k]; };
  const lit = (i) => sp(t, 48.6 + i * 0.12, POP);
  const open = (i) => sp(t, EV.headMarkt + i * 0.03, POP);
  const ring = (r, a0, a1) => {
    g.beginPath();
    const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * 40));
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      const [x, y] = at([NET.x + Math.cos(a) * r, NET.y + Math.sin(a) * r]);
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
  };
  const ctr = at([NET.x, NET.y]);
  g.save(); worldT();
  g.lineCap = 'round';
  // sonar: a ping leaves you on every beat while the window runs
  for (let b = 49; b <= 52; b++) {
    const dt = t - B(b);
    if (dt < 0 || dt > 0.9 || c > 0) continue;
    const p = dt / 0.9;
    ring(mix(100, NET.r2 + 90, E.outCubic(p)), 0, Math.PI * 2);
    g.strokeStyle = `rgba(0,212,255,${0.45 * (1 - p)})`; g.lineWidth = 3 * (1 - p) + 1; g.stroke();
  }
  MARKET.forEach((n, i) => {
    const pin = sp(t, EV.marketDots + i * 0.025, POP);
    if (pin <= 0) return;
    const [x, y, k] = at(polar(n.a, n.r));
    const o = open(i);
    if (o > 0) {
      const [cx, cy] = at(polar(n.a, 100));
      g.strokeStyle = `rgba(238,243,251,${0.22 * o})`; g.lineWidth = 2;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(mix(cx, x, o), mix(cy, y, o)); g.stroke();
    }
    if (c > 0) {
      // pulled into the dot: a streak from where it was a moment ago
      const prevC = Math.max(0, c - 0.18);
      const [ox, oy] = (() => { const [x0, y0] = P(polar(n.a, n.r)); return [mix(x0, 540, prevC), mix(y0, 900, prevC)]; })();
      const gr = g.createLinearGradient(ox, oy, x, y);
      gr.addColorStop(0, 'rgba(0,212,255,0)'); gr.addColorStop(1, 'rgba(160,240,255,0.8)');
      g.strokeStyle = gr; g.lineWidth = 4 * (1 - c) + 1;
      g.beginPath(); g.moveTo(ox, oy); g.lineTo(x, y); g.stroke();
    }
    g.beginPath(); g.arc(x, y, 10 * pin * (1 - c) * k, 0, Math.PI * 2);
    g.fillStyle = o > 0 ? `rgba(238,243,251,${0.3 + 0.7 * o})` : C.dim; g.fill();
    // the market's own flare as the opening wave passes it
    if (c === 0) burst(t, x, y, EV.headMarkt + 0.14, C.ink, 10, 46);
  });
  PARTNERS.forEach((pt, i) => {
    const [x, y] = at(polar(pt.a, NET.r1));
    const s = clamp(spring(t - B(EV.request + i * 0.12), 200, 26));
    if (s > 0) {
      const [cx, cy] = at(polar(pt.a, 100));
      g.strokeStyle = C.cyan; g.lineWidth = 5;
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(mix(cx, x, s), mix(cy, y, s)); g.stroke();
      // the request itself, a comet running out along the spoke
      const run = ramp(t, EV.request + i * 0.12, EV.request + 0.5 + i * 0.12);
      if (run > 0 && run < 1) {
        for (let j = 5; j >= 0; j--) {
          const rr = Math.max(0, E.inOutSine(run) - j * 0.035);
          g.beginPath(); g.arc(mix(cx, x, rr), mix(cy, y, rr), 9 * (1 - j / 7), 0, Math.PI * 2);
          g.fillStyle = j ? `rgba(0,212,255,${0.5 * (1 - j / 6)})` : '#fff'; g.fill();
        }
      }
    }
  });
  // the exclusive window: 24 ticks, one per hour, a radar hand that runs once
  // round with a fading wedge of light behind it, and the ring it leaves lit
  const sweep = ramp(t, EV.sweepFrom, EV.sweepTo);
  const R1 = NET.r1 * (1 - c);
  const pr = sp(t, 48.4, POP);
  if (pr > 0) {
    g.strokeStyle = 'rgba(0,212,255,0.16)'; g.lineWidth = 8;
    g.beginPath(); g.arc(ctr[0], ctr[1], R1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr); g.stroke();
  }
  if (sweep > 0 && sweep < 1 && c === 0) {
    const a1 = -Math.PI / 2 + Math.PI * 2 * sweep, span = 1.15;
    const cg = g.createConicGradient(a1 - span, ctr[0], ctr[1]);
    const f = span / (Math.PI * 2);
    cg.addColorStop(0, 'rgba(0,212,255,0)'); cg.addColorStop(f * 0.999, 'rgba(0,212,255,0.32)'); cg.addColorStop(f, 'rgba(0,212,255,0)'); cg.addColorStop(1, 'rgba(0,212,255,0)');
    g.fillStyle = cg;
    g.beginPath(); g.moveTo(ctr[0], ctr[1]); g.arc(ctr[0], ctr[1], R1, a1 - span, a1); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(220,250,255,0.85)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(ctr[0] + Math.cos(a1) * 100, ctr[1] + Math.sin(a1) * 100); g.lineTo(ctr[0] + Math.cos(a1) * R1, ctr[1] + Math.sin(a1) * R1); g.stroke();
  }
  for (let i = 0; i < 24; i++) {
    const pi = sp(t, 48.4 + i * 0.012, POP);
    if (pi <= 0) continue;
    const ang = -Math.PI / 2 + (i / 24) * Math.PI * 2;
    const passed = sweep * 24 - i;
    const on = passed >= 0 && sweep > 0;
    const glow = on ? Math.exp(-passed * 0.9) : 0;
    const r0 = R1 + 18, r1 = R1 + 18 + ((i % 6 === 0 ? 22 : 12) + 14 * glow) * pi * (1 - c);
    g.strokeStyle = on ? C.cyan : 'rgba(0,212,255,0.25)'; g.lineWidth = (i % 6 === 0 ? 5 : 3) + 2 * glow;
    if (glow > 0.05) { g.shadowColor = C.cyan; g.shadowBlur = 18 * glow; }
    g.beginPath(); g.moveTo(ctr[0] + Math.cos(ang) * r0, ctr[1] + Math.sin(ang) * r0);
    g.lineTo(ctr[0] + Math.cos(ang) * r1, ctr[1] + Math.sin(ang) * r1); g.stroke();
    g.shadowBlur = 0;
  }
  if (sweep > 0) {
    const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * sweep;
    g.strokeStyle = C.cyan; g.lineWidth = 8;
    g.shadowColor = C.cyan; g.shadowBlur = 16;
    g.beginPath(); g.arc(ctr[0], ctr[1], R1, a0, a1); g.stroke();
    g.shadowBlur = 0;
    if (sweep < 1) comet(ctr[0] + Math.cos(a1) * R1, ctr[1] + Math.sin(a1) * R1, C.cyan, 0.8);
    worldT();
  }
  PARTNERS.forEach((pt, i) => {
    const [x, y, k] = at(polar(pt.a, NET.r1));
    const pin = sp(t, EV.partners[i], [420, 22]);
    if (pin <= 0) return;
    const ph = (t / B(1)) % 1;
    const beatPulse = t > B(49) && t < B(52.5) ? Math.exp(-ph * 6) * 0.18 : 0;
    const l = lit(i) > 0.5;
    if (l && c === 0) { g.shadowColor = C.cyan; g.shadowBlur = 24 + 30 * beatPulse; }
    g.beginPath(); g.arc(x, y, 32 * pin * (1 + beatPulse) * (1 - c) * k, 0, Math.PI * 2);
    g.fillStyle = l ? C.cyan : C.bg; g.fill();
    g.shadowBlur = 0;
    g.lineWidth = 5; g.strokeStyle = C.cyan; g.stroke();
  });
  g.restore();
  if (c > 0.02) return;
  PARTNERS.forEach((pt, i) => {
    const pin = sp(t, EV.partners[i], POP);
    if (pin <= 0) return;
    const [x, y] = at(polar(pt.a, NET.r1));
    g.save(); worldT(); g.font = font(30, UI, 600); const tw = g.measureText(pt.name).width; g.restore();
    const cw = (tw + 52) * (0.3 + 0.7 * pin), ch = 66 * (0.5 + 0.5 * pin);
    const below = pt.a === 90;
    const cx = x - cw / 2, cy = below ? y + 52 : y - 52 - ch;
    glass(cx, cy + (1 - pin) * 24, cw, ch, ch / 2, { blur: 18, tint: 0.08, shadow: 0.4 });
    rise(t, pt.name, x, cy + ch / 2 + 11, { beat: EV.partners[i] + 0.05, size: 30, fam: UI, weight: 600, color: C.ink, align: 'center' });
  });
  // offers coming back: price tags running in to you, with a trail
  for (const o of OFFERS) {
    const p = ramp(t, o.beat, o.beat + 0.55);
    if (p <= 0 || p >= 1) continue;
    const [fx, fy] = o.from();
    const e = E.inOutCubic(p);
    const x = mix(fx, NET.x, e), y = mix(fy, NET.y, e);
    const e2 = E.inOutCubic(Math.max(0, p - 0.12));
    g.save(); worldT();
    const gr = g.createLinearGradient(mix(fx, NET.x, e2), mix(fy, NET.y, e2), x, y);
    gr.addColorStop(0, 'rgba(0,212,255,0)'); gr.addColorStop(1, 'rgba(0,212,255,0.7)');
    g.strokeStyle = gr; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(mix(fx, NET.x, e2), mix(fy, NET.y, e2)); g.lineTo(x, y); g.stroke();
    g.restore();
    const sc = Math.min(1, p * 6) * (1 - Math.max(0, (p - 0.8) / 0.2));
    pill(x, y - 24 * sc, 48 * sc, o.price, { size: 24 * sc, color: C.cyan, solid: true, spacing: 0, align: 'center' });
  }
}

/** You, in the middle: the Hamburg terminal flies in and becomes the hub. */
function hub(t, c = 0) {
  const hp = spring(t - B(EV.hub), 150, 22), hs = spring(t - B(EV.hub + 0.05), 170, 22);
  if (hp <= 0 || c > 0.98) return;
  const cx = mix(mix(HAMBURG[0], NET.x, hp), 540, c), cy = mix(mix(HAMBURG[1], NET.y, hp), 900, c);
  const w = mix(144, 200, hs) * (1 - c), h = mix(48, 200, hs) * (1 - c);
  glass(cx - w / 2, cy - h / 2, w, h, h / 2, { blur: 22, tint: 0.09, alpha: Math.min(1, hs * 1.5) });
  g.save(); worldT();
  g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2);
  if (hs < 1) { g.fillStyle = hexA(C.ink, clamp(1 - hs * 1.4)); g.fill(); }
  g.lineWidth = 4; g.strokeStyle = hexA(C.cyan, clamp(hs * 1.4)); g.stroke();
  if (hs < 0.7) {
    // the terminal's dark centre line, shrinking away as it opens up
    g.lineCap = 'round'; g.lineWidth = 16 * (1 - hs / 0.7); g.strokeStyle = C.bg;
    g.beginPath(); g.moveTo(cx - 48 * (1 - hs / 0.7), cy); g.lineTo(cx + 48 * (1 - hs / 0.7), cy); g.stroke();
  }
  g.restore();
  if (c > 0) return;
  rise(t, 'DU', NET.x, NET.y + 30, { beat: 46.25, size: 92, color: C.ink, align: 'center', out: 48.6 });
  rise(t, '24 H', NET.x, NET.y + 24, { beat: EV.sweepFrom, size: 96, color: C.ink, align: 'center', out: 52.4 });
  rise(t, 'EXKLUSIV', NET.x, NET.y + 62, { beat: EV.sweepFrom + 0.1, size: 22, fam: UI, weight: 700, color: C.cyan, align: 'center', out: 52.4, spacing: 4 });
  rise(t, 'ALLE', NET.x, NET.y + 30, { beat: EV.headMarkt + 0.1, size: 92, color: C.ink, align: 'center', out: EV.offerCard - 0.1 });
}

    x = mix(x, 540 - 26, c); y = mix(y, 900 - 26, c); w = mix(w, 52, c); h = mix(h, 52, c); r = mix(r, 26, c);

  const x0 = 540 - total / 2;

function wordmark(t) {
  const out = E.inCubic(ramp(t, EV.retract, EV.retract + 0.7));
  const p = spring(t - B(EV.wordmark), 200, 26) * (1 - out);
  const dotX = mix(540, LOCK.dotX, p);
  // the word is pulled out of the dot in one piece: it is clipped at the
  // dot's right edge and slides out from behind it, blurred by its own speed
  const textW = LOCK.adv[9] + 120;
  const x = mix(dotX + 34 - textW, LOCK.textX, p);
  const pNext = spring(t - B(EV.wordmark) + 1 / 60, 200, 26) * (1 - E.inCubic(ramp(t + 1 / 60, EV.retract, EV.retract + 0.7)));
  const v = (pNext - p) * (LOCK.textX - (540 + 34 - textW));
  if (p > 0.002) {
    g.save(); worldT();
    g.beginPath(); g.rect(dotX + 22, 600, 1200, 600); g.clip();
    g.font = font(LOCK.size); g.textBaseline = 'alphabetic';
    paintText('NEUROROUTE', x, LOCK.base, C.ink, 0, Math.abs(v) > 3 ? v * 1.5 : 0);
    // once it has landed, a band of light runs across the letters
    const sw = ramp(t, EV.wordmark + 0.7, EV.wordmark + 1.8);
    if (sw > 0 && sw < 1) {
      const bx = mix(x - 300, x + LOCK.adv[9] + 300, E.inOutCubic(sw));
      const gr = g.createLinearGradient(bx - 140, LOCK.base - LOCK.size, bx + 40, LOCK.base);
      gr.addColorStop(0, 'rgba(160,240,255,0)'); gr.addColorStop(0.5, 'rgba(200,248,255,0.85)'); gr.addColorStop(1, 'rgba(160,240,255,0)');
      g.fillStyle = gr; g.fillText('NEUROROUTE', x, LOCK.base);
    }
    g.restore();
  }
  return dotX;
}

function brandDot(t, x, y, r) {
  // the website logo breathes; so does this one, on the beat
  const ph = (t / B(1)) % 1;
  const live = clamp(ramp(t, EV.wordmark, EV.wordmark + 0.3) - ramp(t, EV.retract, EV.retract + 0.4));

  g.save(); worldT();
  g.shadowColor = C.cyan; g.shadowBlur = 26 + 20 * (breathe - 1) * 10;
  g.beginPath(); g.arc(x, y, r * breathe, 0, Math.PI * 2);
  g.fillStyle = C.cyan; g.fill();
  g.restore();
}

// The full loop becomes this week in a row of weeks. The forecast runs across
// them like the card's scan, and each week fills to what it predicts: full,
// hollow (free capacity) or over the top (more freight than trucks). Free and
// excess capacity go out to tender: a shipper enters a volume that fills the

// the row folds back into the one big loop the network chapter starts from.

// founder asked for them in the film. SOON tags the forecast as coming soon.

// the forecast sweeps the row; each week shows its forecast as the light passes
const SCAN = { x0: 60, x1: 1000 };
const scanX = (t) => mix(SCAN.x0, SCAN.x1, E.inOutSine(ramp(t, EV.scanFrom, EV.scanTo)));
const revealBeat = (i) => {
  const p = (weekX(i) - SCAN.x0) / (SCAN.x1 - SCAN.x0);
  return EV.scanFrom + (Math.acos(1 - 2 * p) / Math.PI) * (EV.scanTo - EV.scanFrom);
};
// the free weeks fill when the shipper's volume arrives; the excess leaves
// when the carrier takes it
const pourAt = (i) => EV.pourFrom + (i === 5 ? 0.15 : 0);
function weekFill(t, i) {
  const w = WEEKS[i];
  if (i === 0) return 1;
  const rv = revealBeat(i);
  let f = w.f * E.outCubic(ramp(t, rv, rv + 0.7));
  if (w.f < 1) f = mix(f, 1, E.inOutCubic(ramp(t, pourAt(i), EV.pourTo)));
  if (w.f > 1 && t >= B(EV.takeFrom)) f = 1;
  return f;
}
/** 0 until the week is drawn in, 1 once it stands. */
const weekIn = (t, i) => (i === 0 ? 1 : ramp(t, EV.weeksIn + i * 0.16, EV.weeksIn + i * 0.16 + 0.5));
/** How far the week has slid into this week's slot at the end (0..1). */
const weekMerge = (t, i) => clamp(spring(t - B(EV.merge + (5 - i) * 0.05), 150, 24));

// the tender card, below the row; the camera goes down to it and back
const TCARD = { x: 72, y: 1450, w: 936, h: 436, r: 44 };
const ROW1 = TCARD.y + 160, ROW2 = TCARD.y + 264;
const FIELD = { x: 132, y: TCARD.y + 326, w: 500, h: 80 };
const ENTER = { x: 652, y: TCARD.y + 326, w: 296, h: 80 };
const TAKE = { x: 648, y: ROW2 - 50, w: 300, h: 70 };
const TYPED = '20 Ladungen';
const tcardIn = (t) => spring(t - B(EV.tender), 140, 21);
const tcardOut = (t) => spring(t - B(EV.cardAway), 150, 24);
const VERL3 = {
  keys: [[EV.verlIn3, [1220, 2160]], [EV.verlIn3 + 0.05, [1220, 2160]], [EV.field - 0.12, [FIELD.x + 250, FIELD.y + 44]],
    [EV.typeTo, [ENTER.x + 150, ENTER.y + 44]], [EV.click6 + 0.8, [1260, 2200]]],
  clicks: [EV.field, EV.click6], hover: [[EV.click6 - 0.35, EV.click6 + 0.3]], label: 'Verlader', color: C.cyan,
};
const SPED3 = {
  keys: [[EV.spedIn2, [1260, 1560]], [EV.spedIn2 + 0.05, [1260, 1560]], [EV.click7 - 0.5, [TAKE.x + 100, TAKE.y + 42]],
    [EV.click7 + 0.9, [1280, 1700]]],
  clicks: [EV.click7], hover: [[EV.click7 - 0.4, EV.click7 + 0.3]], label: 'Hansa Transport', color: C.amber,
};

/** A light travelling from one world point to another, with a short trail. */
function flyLight(t, from, to, b0, b1, color, size = 0.6) {
  const p = ramp(t, b0, b1);
  if (p <= 0 || p >= 1) return;
  const e = E.inOutCubic(p), e2 = E.inOutCubic(Math.max(0, p - 0.14));
  const arc = (q) => [mix(from[0], to[0], q), mix(from[1], to[1], q) - 120 * Math.sin(Math.PI * q)];
  const [x, y] = arc(e), [x2, y2] = arc(e2);
  g.save(); worldT();
  const gr = g.createLinearGradient(x2, y2, x, y);
  gr.addColorStop(0, hexA(color, 0)); gr.addColorStop(1, hexA(color, 0.8));
  g.strokeStyle = gr; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x2, y2); g.lineTo(x, y); g.stroke();
  g.restore();
  comet(x, y, color, size);
}

/** A pill that pops in, and at `swap` pops out for a second one. */
function swapPill(t, cx, y, h, inBeat, swap, a, b, size = 22) {
  const pa = sp(t, inBeat, POP) * (swap == null ? 1 : 1 - sp(t, swap, SNAP));
  if (pa > 0.01) pill(cx, y, h, a.text, { size, color: a.color, solid: a.solid, scale: pa, align: 'center' });
  const pb = swap == null ? 0 : sp(t, swap + 0.06, POP);
  if (pb > 0.01) pill(cx, y, h, b.text, { size, color: b.color, solid: b.solid, scale: pb, align: 'center' });
}

function planHeadlines(t) {
  const L1 = 430, L2 = 590, S1 = 170;
  rise(t, 'NÄCHSTE', 72, L1, { beat: EV.headWeeks, size: S1, color: C.ink, out: EV.headKI - 0.15 });
  rise(t, 'WOCHEN?', 72, L2, { beat: EV.headWeeks + 0.25, size: S1, color: C.cyan, out: EV.headKI - 0.1 });
  rise(t, 'KI RECHNET', 72, L1, { beat: EV.headKI, size: S1, color: C.ink, out: EV.headTender - 0.15 });
  rise(t, 'VORAUS.', 72, L2, { beat: EV.headKI + 0.25, size: S1, color: C.cyan, out: EV.headTender - 0.1 });
  const S3 = fitSize('AUSGESCHRIEBEN.', 940 - 72, S1);
  rise(t, 'AUTOMATISCH', 72, L1, { beat: EV.headTender, size: S3, color: C.ink, out: EV.cardAway });
  rise(t, 'AUSGESCHRIEBEN.', 72, L2, { beat: EV.headTender + 0.25, size: S3, color: C.cyan, out: EV.cardAway + 0.05 });
  // the payoff of the chapter: full words slam in
  for (const [text, y, b, col] of [['ALLES VOLL', L1, EV.allFull, C.ink], ['GEPLANT.', L2, EV.allFull + 0.25, C.green]]) {
    if (t < B(b) + 0.4) slamWord(t, text, 72, y, b, S1, col);
    else rise(t, text, 72, y, { beat: b, size: S1, color: col, out: EV.merge - 0.25 + (y === L2 ? 0.05 : 0) });
  }
  // the forecast is labelled, and tagged as coming soon
  const pk = sp(t, EV.headKI + 0.4, POP) * (1 - sp(t, EV.allFull - 0.2, SNAP));
  if (pk > 0.01) {
    const w = pill(72, 646, 60, 'KI-PROGNOSE', { size: 27, color: C.cyan, scale: pk });
    if (SOON) pill(72 + w + 14, 646, 60, 'BALD', { size: 27, color: C.muted, scale: pk });
  }
}

function weekRow(t) {
  const intro = spring(t - B(EV.planFrom), 110, 22);
  const grow = spring(t - B(EV.merge + 0.5), 100, 20);
  const allFull = t >= B(EV.allFull);
  const flowOn = clamp(spring(t - B(EV.allFull), 200, 26));
  // the scan: the forecast runs across the weeks
  const sc = ramp(t, EV.scanFrom, EV.scanTo);
  if (sc > 0 && sc < 1) {
    const sx = scanX(t);
    g.save(); worldT();
    const gr = g.createLinearGradient(sx - 200, 0, sx, 0);
    gr.addColorStop(0, 'rgba(0,212,255,0)'); gr.addColorStop(1, 'rgba(0,212,255,0.2)');
    g.fillStyle = gr; g.fillRect(sx - 200, weekTop - 60, 200, WEEK.labelY - weekTop + 90);
    g.fillStyle = C.cyan; g.fillRect(sx - 1.5, weekTop - 60, 3, WEEK.labelY - weekTop + 90);
    g.restore();
    comet(sx, weekTop - 60, C.cyan, 0.5);
  }
  // this week: the big loop shrinks into the first slot, and at the end grows
  // back out of it. The other weeks slide into its pose and disappear in it.
  let pose0 = poseMix(POSE_OPEN, weekPose(0), intro, intro, intro);
  if (grow > 0) pose0 = poseMix(pose0, POSE_OPEN, grow, grow, grow);
  // later weeks first, so this week sits on top when they slide into it
  for (let i = WEEKS.length - 1; i >= 0; i--) {
    const m = i === 0 ? 0 : weekMerge(t, i);
    if (m > 0.995) continue;
    const pose = i === 0 ? pose0 : poseMix(weekPose(i), pose0, m, m, m);
    const din = weekIn(t, i);
    if (din <= 0) continue;
    const rv = i === 0 ? -1 : revealBeat(i);
    const seen = i === 0 || t >= B(rv);
    const f = weekFill(t, i);
    g.save();
    g.globalAlpha = seen ? 1 : 0.38;
    drawLoop(pose, {
      out: i === 0 ? 1 : E.outCubic(clamp(din * 2)), back: i === 0 ? 1 : E.inOutCubic(clamp(din * 2 - 1)),
      fill: Math.min(1, f), tube: i === 0 ? mix(mix(20, WEEK.tube, intro), 20, grow) : WEEK.tube,
      stationM: i === 0 ? 1 : sp(t, EV.weeksIn + i * 0.16 + 0.25, [420, 22]), stationH: i === 0 ? 1 : sp(t, EV.weeksIn + i * 0.16 + 0.45, [420, 22]),
      flow: i === 0 ? 1 : flowOn, t, glow: Math.max(i === 0 ? 1 - intro : 0, allFull ? 1 - grow : 0),
      bubbles: (t > B(rv) && t < B(rv + 0.7)) || (WEEKS[i].f < 1 && t > B(pourAt(i)) && t < B(EV.pourTo)) ? t : null,
    });
    g.restore();
    // more freight than trucks: it stands over the top of the terminal
    if (f > 1 && i !== 0) {
      const h = (f - 1) * WEEK_LEG, x = weekRight(i);
      const wob = 4 * Math.sin(t * 9 + i);
      g.save(); worldT();
      g.lineCap = 'round'; g.strokeStyle = C.green; g.lineWidth = WEEK.tube / cam.s;
      g.shadowColor = C.green; g.shadowBlur = 18;
      g.beginPath(); g.moveTo(x, weekTop - 6); g.lineTo(x, weekTop - h); g.stroke();
      g.beginPath(); g.arc(x, weekTop - h, (WEEK.tube * 0.9 + wob * 0.3) / cam.s, 0, Math.PI * 2); g.fillStyle = C.green; g.fill();
      g.restore();
    }
    if (seen && i !== 0) flash(weekX(i), weekTop, C.cyan, 0.5 * hit(t, rv, 7), 160);
    if (allFull && m < 0.01) {
      flash(weekX(i), weekTop, C.green, 0.7 * hit(t, EV.allFull + i * 0.05, 6), 200);
      burst(t, weekX(i), weekTop, EV.allFull + i * 0.05, C.green, 14, 90);
    }
    // the week's name
    rise(t, WEEKS[i].kw, weekX(i), WEEK.labelY, { beat: EV.weeksIn + i * 0.16 + 0.1, size: 26, fam: UI, weight: 600, color: i === 0 ? C.ink : C.muted, align: 'center', spacing: 2, out: EV.merge - 0.3 + i * 0.03 });
  }
  // the excess leaves: it lifts off the full week and flies to the carrier's row
  const over = WEEKS.findIndex((w) => w.f > 1);
  flyLight(t, [weekRight(over), weekTop - (WEEKS[over].f - 1) * WEEK_LEG], [TAKE.x + 40, TAKE.y + 33], EV.takeFrom, EV.takeTo, C.green, 0.8);
  // forecast tags over the weeks that need something; they turn to VOLL
  WEEKS.forEach((w, i) => {
    if (!w.tag) return;
    const overW = w.f > 1;
    const y = overW ? weekTop - (w.f - 1) * WEEK_LEG - 92 : WEEK.tagY - 30;
    const swap = overW ? EV.takeTo : EV.pourTo;
    const k = WEEKS.slice(0, i).filter((v) => v.tag).length;
    const outP = sp(t, EV.allFull - 0.1, SNAP);
    if (outP > 0.99) return;
    g.save(); g.globalAlpha = 1;
    swapPill(t, weekX(i) + (overW ? 48 * WEEK.s : 0), y, 56, EV.tags + k * 0.12, swap,
      { text: w.tag, color: overW ? C.cyan : C.amber, solid: false }, { text: 'VOLL', color: C.green, solid: true }, 26);
    g.restore();
  });
}

function tenderCard(t) {
  const e = tcardIn(t), ex = tcardOut(t);
  if (e <= 0.001 || ex > 0.995) return;
  const y = TCARD.y + 260 * (1 - e) + 900 * ex;
  const tilt = 0.7 * (1 - spring(t - B(EV.tender), 110, 14)) - 0.6 * ex;
  const rect = [TCARD.x, y, TCARD.w, TCARD.h];
  const dy = y - TCARD.y;
  panel3D(() => {
    glass(...rect, TCARD.r, { blur: 26, tint: 0.07 });
    tenderContent(t, dy);
  }, rect, tilt);
}

function tenderContent(t, dy) {
  const at = (yy) => yy + dy;
  const b0 = EV.tender + 0.35;
  rise(t, 'AUSSCHREIBUNG', 132, at(TCARD.y + 74), { beat: b0, size: 27, fam: UI, weight: 700, color: C.cyan, spacing: 4 });
  rise(t, 'München → Hamburg', 948, at(TCARD.y + 74), { beat: b0 + 0.05, size: 30, fam: UI, weight: 500, color: C.muted, align: 'right' });
  const pd = sp(t, b0 + 0.1, POP);
  if (pd > 0) { g.save(); worldT(); g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(132, at(TCARD.y + 100), 816 * pd, 2); g.restore(); }
  // row 1: free capacity, for shippers
  uiText(t, 'KW 46 + 49', 132, at(ROW1), b0 + 0.15, 42, C.ink, 600);
  uiText(t, 'Frei: 20 Ladungen', 132, at(ROW1 + 42), b0 + 0.2, 31, C.muted, 400);
  swapPill(t, 830, at(ROW1 - 48), 60, b0 + 0.3, EV.click6 + 0.05,
    { text: 'FREI', color: C.amber, solid: false }, { text: 'GEBUCHT ✓', color: C.green, solid: true }, 26);
  // row 2: excess, for carriers looking for loads
  uiText(t, 'KW 47', 132, at(ROW2), b0 + 0.25, 42, C.ink, 600);
  uiText(t, 'Zu vergeben: 8 Ladungen', 132, at(ROW2 + 42), b0 + 0.3, 31, C.muted, 400);
  const pt = sp(t, b0 + 0.4, POP);
  const taken = sp(t, EV.click7 + 0.05, SNAP);
  if (pt > 0) {
    if (taken > 0.5) button(TAKE.x, at(TAKE.y), TAKE.w, TAKE.h, 'Übernommen ✓', { size: 31, scale: 0.94 + 0.06 * taken });
    else button(TAKE.x, at(TAKE.y), TAKE.w, TAKE.h, 'Übernehmen', { color: C.cyan, outline: true, size: 31, scale: (0.3 + 0.7 * pt) * (1 - 0.06 * pulse(t, EV.click7)) });
  }
  // the volume field and its button
  const pf = sp(t, b0 + 0.5, POP);
  if (pf > 0) {
    const focus = sp(t, EV.field, SNAP) * (1 - sp(t, EV.click6, SNAP));
    g.save(); worldT();
    g.globalAlpha = pf;
    g.beginPath(); g.roundRect(FIELD.x, at(FIELD.y), FIELD.w, FIELD.h, 20);
    g.fillStyle = 'rgba(255,255,255,0.06)'; g.fill();
    g.lineWidth = 2.5; g.strokeStyle = focus > 0.01 ? hexA(C.cyan, 0.35 + 0.65 * focus) : 'rgba(255,255,255,0.16)'; g.stroke();
    g.font = font(33, UI, 500); g.textBaseline = 'middle';
    const n = Math.floor(ramp(t, EV.typeFrom, EV.typeTo) * TYPED.length + 1e-6);
    const typed = TYPED.slice(0, n);
    if (n === 0) { g.fillStyle = C.muted; g.fillText('Deine Menge …', FIELD.x + 28, at(FIELD.y) + FIELD.h / 2 + 1); }
    else { g.fillStyle = C.ink; g.fillText(typed, FIELD.x + 28, at(FIELD.y) + FIELD.h / 2 + 1); }
    const caretOn = t >= B(EV.field) && t < B(EV.click6) && ((t / B(0.5)) % 1) < 0.55;
    if (caretOn) {
      const cx = FIELD.x + 28 + (n ? g.measureText(typed).width + 4 : 0);
      g.fillStyle = C.cyan; g.fillRect(cx, at(FIELD.y) + 20, 3, FIELD.h - 40);
    }
    g.restore();
    const sent = sp(t, EV.click6 + 0.05, SNAP);
    if (sent > 0.5) button(ENTER.x, at(ENTER.y), ENTER.w, ENTER.h, 'Eingetragen ✓', { size: 31, scale: 0.94 + 0.06 * sent });
    else button(ENTER.x, at(ENTER.y), ENTER.w, ENTER.h, 'Eintragen', { color: C.cyan, size: 33, scale: (0.3 + 0.7 * pf) * (1 - 0.06 * pulse(t, EV.click6)) });
  }
}

// ---------------------------------------------------------------- the scenes

const SCENES = {
  loop(t) {
    const G = geo(POSE_OPEN.leg);
    const headAt = (tt) => {
      const b = loopBack(tt);
      return poseApply(POSE_OPEN, loopPoint(b > 0 ? G.S_M + b * (G.LTOT - G.S_M) : loopOut(tt) * G.S_M, G));
    };
    const HAMB = [POSE_OPEN.x, 950 + TOP], MUN = [POSE_OPEN.x, 950 + ARC_Y + POSE_OPEN.leg];
    // the launch: light bursts out of the terminal as the line leaves
    flash(...HAMB, C.cyan, 0.8 * hit(t, 0.03, 6), 420);
    drawLoop(POSE_OPEN, { out: loopOut(t), back: loopBack(t), stationM: sp(t, EV.arriveM, [520, 20]), glow: 1 });
    // a comet rides the head, throwing sparks: cyan out, amber and sparser back
    sparks(t, headAt, B(0.03), B(EV.arriveM), C.cyan);
    sparks(t, headAt, B(EV.turn), B(EV.arriveH), C.amber, { count: 1, speed: 0.6 });
    if (t > B(0.03) && t < B(EV.arriveM)) comet(...headAt(t), C.cyan, 1);
    if (t > B(EV.turn) && t < B(EV.arriveH)) comet(...headAt(t), C.amber, 0.75);
    flash(...MUN, C.cyan, 0.9 * hit(t, EV.arriveM, 6), 460);
    flash(...HAMB, C.amber, 0.55 * hit(t, EV.arriveH, 6), 300);
    burst(t, ...MUN, EV.arriveM, C.ink, 26, 170);
    burst(t, ...HAMB, EV.arriveH, C.amber, 30, 150);
    stationLabels(t, POSE_OPEN, 0);
    words(t, { hero: true });
  },

  card(t) {
    words(t, { exit: EV.morph });
    drawCard(t, { press: 1 - 0.07 * pulse(t, EV.click1) });
    rise(t, 'AUTOMATISCH', 72, 600, { beat: EV.headA, size: 150, color: C.ink, out: 12.7 });
    rise(t, 'ERKANNT.', 72, 740, { beat: EV.headB, size: 150, color: C.cyan, out: 12.75 });
    cursor(t, SPED);
  },

  offer(t) {
    offerBackdrop(t);
    offerHeadlines(t);
    const [m, mh] = modalOpen(t);
    // the green button grows into the panel
    const x = mix(BTN.x, MODAL.x, m), w = mix(BTN.w, MODAL.w, m);
    const y = mix(BTN.y, MODAL.y, mh), h = mix(BTN.h, MODAL.h, mh);
    // it opens tilted back and swings up to face you, overshooting a little
    const tilt = 0.62 * (1 - spring(t - B(EV.unfold), 110, 14));
    panel3D(() => {
      glass(x, y, w, h, mix(24, MODAL.r, m), { fill: hexA(C.green, Math.max(0, 1 - m * 1.6)), tint: 0.07 });
      offerContent(t, [x, y, w, h]);
    }, [x, y, w, h], tilt);
    cursor(t, SPED);
  },

  market(t) {
    // the offer world is still in frame until the whip carries it away
    if (t < B(EV.whipUp + 0.6)) { offerBackdrop(t); offerHeadlines(t); }
    if (t > B(EV.whipUp - 0.2)) marketWorld(t);
    ourListing(t);
    if (t < B(EV.whipUp + 0.6)) cursor(t, SPED);
    cursor(t, VERL);
  },

  payoff(t) {
    // the marketplace is still in frame until the whip carries it away
    if (t < B(EV.whipDown + 0.6)) {
      marketWorld(t);
      const y = slotY(0);
      glass(ROW.x, y, ROW.w, ROW.h, ROW.r, { blur: 22, tint: 0.07, shadow: 0.45, fill: hexA(C.green, 0.1) });
      outlineSweep(ROW.x + 1, y + 1, ROW.w - 2, ROW.h - 2, ROW.r, 1, C.green, 4);
      rowContent(t, y, { route: 'München → Hamburg', sub: 'Rückfahrt · 6 Container · Müller Spedition', price: '€1.190', pct: '−30 %' }, { beat: -10, booked: 1, glyph: false });
      cursor(t, VERL);
    }
    // the way back leaves the listing and grows into the big loop again
    const pp = spring(t - B(EV.whipDown + 0.05), 120, 22), pr = spring(t - B(EV.whipDown + 0.1), 100, 18), ps = spring(t - B(EV.whipDown + 0.15), 120, 22);
    const pose = poseMix(glyphPose(slotY(0)), POSE_OPEN, pp, pr, ps);
    const out = E.inOutCubic(ramp(t, EV.outRedraw, EV.outRedraw + 0.6));
    const fill = 0.18 + 0.82 * E.inOutCubic(ramp(t, EV.fillFrom, EV.drop));
    const flow = clamp(spring(t - B(EV.drop), 200, 26));
    const grow = clamp(ps);
    const filling = t > B(EV.fillFrom) && t < B(EV.drop);
    drawLoop(pose, {
      out, back: 1, fill, tube: mix(10, 20, grow), stationM: mix(0.45, 1, grow), stationH: mix(0.45, 1, grow),
      hk: E.inOutCubic(ramp(t, EV.outRedraw, EV.outRedraw + 0.5)), flow, t, glow: grow, bubbles: filling ? t : null,
    });
    stationLabels(t, POSE_OPEN, 0, { appearH: EV.words2 - 0.2, appearM: EV.words2 - 0.1 });
    // the liquid's surface sloshes while it climbs, and settles once full
    const wave = 10 * clamp(ramp(t, EV.fillFrom, EV.fillFrom + 0.4) - ramp(t, EV.drop - 0.2, EV.drop + 0.3));
    words(t, {
      beats: [EV.words2, EV.words2 + 0.2, EV.words2 + 0.4, EV.words2 + 0.6], rolled: EV.roll,
      level: grow > 0.99 ? fillLevel(POSE_OPEN, fill) : Infinity, shine: EV.drop, hero: true, wave,
    });
    // full: it splashes over at the top, and the whole loop lights up
    const HAMB = [POSE_OPEN.x, 950 + TOP], MUN = [POSE_OPEN.x, 950 + ARC_Y + POSE_OPEN.leg];
    splash(t, ...HAMB, EV.drop, C.green);
    flash(...HAMB, C.green, 1.0 * hit(t, EV.drop, 5), 620);
    flash(...MUN, C.green, 0.5 * hit(t, EV.drop + 0.05, 5), 380);
    burst(t, ...HAMB, EV.drop, C.green, 30, 240);
    burst(t, ...MUN, EV.drop, C.green, 30, 200);
  },

  plan(t) {
    // the words and station names leave as the loop becomes this week
    if (t < B(EV.planFrom + 1.5)) words(t, { rolled: EV.roll, level: -1e4, out: EV.planFrom });
    stationLabels(t, POSE_OPEN, 0, { appearH: EV.words2 - 0.2, appearM: EV.words2 - 0.1, out: EV.planFrom + 0.05 });
    if (t >= B(EV.labelsBack)) stationLabels(t, POSE_OPEN, 0, { appearH: EV.labelsBack, appearM: EV.labelsBack + 0.1 });
    weekRow(t);
    planHeadlines(t);
    tenderCard(t);
    // the tags are lifted into the tender
    WEEKS.forEach((w, i) => {
      if (!w.tag) return;
      const overW = w.f > 1;
      const from = [weekX(i) + (overW ? 48 * WEEK.s : 0), overW ? weekTop - (w.f - 1) * WEEK_LEG - 60 : WEEK.tagY];
      const to = overW ? [TAKE.x + TAKE.w / 2, TAKE.y + 33] : [830, ROW1 - 20];
      flyLight(t, from, to, EV.tender + 0.3 + i * 0.05, EV.tender + 0.85 + i * 0.05, overW ? C.cyan : C.amber, 0.5);
    });
    // the shipper's volume flies up into the free weeks
    WEEKS.forEach((w, i) => {
      if (!(w.f < 1)) return;
      flyLight(t, [830, ROW1 - 20], [weekRight(i), weekTop], pourAt(i) - 0.45, pourAt(i), C.green, 0.7);
    });
    cursor(t, VERL3);
    cursor(t, SPED3);
  },

  network(t) {
    // the full loop rolls itself up into Hamburg, and Hamburg becomes you
    const len = 1 - E.inOutCubic(ramp(t, EV.collapse + 0.15, EV.hub + 0.1));
    if (len > 0.01) {
      drawLoop({ ...POSE_OPEN, len: Math.max(0.02, len) }, {
        out: 1, back: 1, fill: 1, flow: 1, t, stationM: clamp(len * 3), stationH: t < B(EV.hub) ? 1 : 0,
      });
    } else if (t < B(EV.hub)) {
      drawLoop({ ...POSE_OPEN, len: 0.02 }, { stationM: 0, stationH: 1 });
    }
    stationLabels(t, POSE_OPEN, 0, { out: EV.collapse + 0.05 });
    const cardOn = t > B(EV.offerCard);
    const depth = cardOn ? spring(t - B(EV.offerCard), 160, 22) : 0;
    if (depth > 0.001) {
      withDepth(() => { networkGraph(t); hub(t); }, { blur: 10 * depth, dim: 0.45 * depth, scale: 1 - 0.06 * depth, cx: NET.x, cy: NET.y });
    } else {
      networkGraph(t);
      hub(t);
    }
    networkHeadlines(t);
    // the partner's offer swings up out of the hub in 3D
    const OR = offerCardRect(t);
    if (OR.e > 0) panel3D(() => offerCard(t), [OR.x, OR.y, OR.w, OR.h], 0.7 * (1 - spring(t - B(EV.offerCard), 110, 14)));
    cursor(t, VERL2);
  },

  logo(t) {
    const c = spring(t - B(EV.converge), 190, 26);
    // the network and the accepted offer pour into one cyan dot
    if (c < 0.995) {
      const depth = 1 - c;
      withDepth(() => { networkGraph(t, c); hub(t, c); }, { blur: 10 * depth, dim: 0.45 * depth, scale: 1 - 0.06 * depth, cx: NET.x, cy: NET.y });
    }
    if (c < 0.96) offerCard(t, c);
    networkHeadlines(t);
    cursor(t, VERL2);
    const home = spring(t - B(EV.home), 120, 22);
    const dotX = wordmark(t);
    if (c >= 0.96 && home < 0.001) brandDot(t, dotX, 900, 26);
    // claim and call to action
    rise(t, 'Erst dein Netzwerk.', 540 - 8, 1110, { beat: EV.tagline, size: 46, fam: UI, weight: 600, color: C.ink, align: 'right', out: EV.outro });
    rise(t, 'Dann der Markt.', 540 + 8, 1110, { beat: EV.tagline + 0.15, size: 46, fam: UI, weight: 400, color: C.muted, align: 'left', out: EV.outro + 0.05 });
    const pc = sp(t, EV.cta, POP) * (1 - spring(t - B(EV.outro), 300, 30));
    if (pc > 0.001) {
      const bw = 470, bh = 108, bx = 540 - bw / 2, by = 1210;
      button(bx, by + (1 - pc) * 50, bw, bh, 'Demo anfragen  →', { color: C.cyan, size: 40, scale: (0.2 + 0.8 * pc) * (1 - 0.06 * pulse(t, EV.click5)) });
    }
    rise(t, 'neuroroute.com', 540, 1420, { beat: EV.cta + 0.2, size: 36, fam: UI, weight: 600, color: C.muted, align: 'center', out: EV.outro + 0.1, spacing: 2 });
    cursor(t, DU);
    // home: the dot travels back to Hamburg and becomes the terminal of frame 0
    if (home > 0.001) {
      const hs = spring(t - B(EV.home + 0.25), 150, 22);
      const x = mix(540, HAMBURG[0], home), y = mix(900, HAMBURG[1], home);
      // drawn the way drawLoop draws the terminal: 48 px thick on screen, a 96-unit span
      const span = mix(0, 96, hs), thick = mix(52, 48 / cam.s, hs);
      g.save(); worldT();
      g.lineCap = 'round';
      g.lineWidth = thick;
      g.strokeStyle = `rgb(${mix(0, 238, hs)},${mix(212, 243, hs)},${mix(255, 251, hs)})`;
      g.beginPath(); g.moveTo(x - span / 2, y); g.lineTo(x + span / 2, y); g.stroke();
      if (hs > 0.001) {
        g.lineWidth = (16 / cam.s) * hs; g.strokeStyle = C.bg;
        g.beginPath(); g.moveTo(x - span / 2, y); g.lineTo(x + span / 2, y); g.stroke();
      }
      g.restore();
      rise(t, 'HAMBURG', HAMBURG[0] - 70, HAMBURG[1] - 60, { beat: EV.homeLabel, size: 34, fam: UI, weight: 600, color: C.muted, spacing: 6 });
    }
  },
};

// -------------------------------------------------------------------- seek

// Shockwaves through the finished frame, each at a world point: impacts,
// clicks, the drop, the market opening, the logo.
const SHOCKS = () => [
  { beat: EV.arriveM, at: [POSE_OPEN.x, 950 + ARC_Y + POSE_OPEN.leg], r0: 30, r1: 900, dur: 0.6, width: 70, strength: 0.7 },
  { beat: EV.click1, at: [BTN.x + BTN.w / 2, BTN.y + BTN.h / 2], r0: 20, r1: 340, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.click2, at: [PUBLISH.x + PUBLISH.w / 2, PUBLISH.y + PUBLISH.h / 2], r0: 20, r1: 380, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.click3, at: [BOOK(slotY(0)).x + 79, BOOK(slotY(0)).y + 26], r0: 20, r1: 340, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.drop, at: [POSE_OPEN.x, 950 + TOP], r0: 40, r1: 1800, dur: 0.85, width: 90, strength: 0.6 },
  { beat: EV.click6, at: [ENTER.x + ENTER.w / 2, ENTER.y + ENTER.h / 2], r0: 20, r1: 340, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.click7, at: [TAKE.x + TAKE.w / 2, TAKE.y + TAKE.h / 2], r0: 20, r1: 340, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.allFull, at: [weekX(2.5), WEEK.y], r0: 40, r1: 1500, dur: 0.8, width: 90, strength: 0.6 },
  { beat: EV.headMarkt, at: [NET.x, NET.y], r0: 100, r1: 1400, dur: 0.75, width: 90, strength: 0.7 },
  { beat: EV.click4, at: [ACCEPT.x + ACCEPT.w / 2, ACCEPT.y + ACCEPT.h / 2], r0: 20, r1: 380, dur: 0.45, width: 40, strength: 0.6 },
  { beat: EV.wordmark, at: [540, 900], r0: 30, r1: 1300, dur: 0.7, width: 80, strength: 0.6 },
  { beat: EV.click5, at: [540, 1264], r0: 20, r1: 340, dur: 0.45, width: 40, strength: 0.6 },
];

function postFX(t) {
  for (const w of SHOCKS()) {
    const dt = t - B(w.beat);
    if (dt <= 0 || dt > w.dur) continue;
    const p = dt / w.dur;
    const [sx, sy] = toScreen(...w.at);
    shockwave(sx, sy, mix(w.r0, w.r1, E.outCubic(p)) * cam.s, w.width * cam.s, w.strength * (1 - p) * Math.min(1, dt / 0.03));
  }
  // colour split on the hardest hits, and along the direction of a whip
  const a = camAt(t), b = camAt(t - 1 / 240);
  const v = Math.abs(a.cy - b.cy) * a.s * 4;
  const whip = clamp((v - 30) / 12, 0, 9);
  const hitSplit = 10 * hit(t, EV.drop, 9) + 8 * hit(t, EV.allFull, 9) + 7 * hit(t, EV.headMarkt, 9) + 6 * hit(t, EV.wordmark, 9) + 5 * hit(t, EV.arriveM, 10);
  if (whip > hitSplit) rgbSplit(whip, [0, 1]); else rgbSplit(hitSplit, [1, 0]);
}

window.seek = (t) => {
  g = main;
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.globalAlpha = 1;
  main.filter = 'none';
  cam = camAt(t);
  background(t);
  const beat = t / B(1);
  const shot = SHOTS.find((s) => beat >= s.from && beat < s.to) ?? SHOTS[SHOTS.length - 1];
  SCENES[shot.id](t);
  finish();
  postFX(t);
  speedLines(t);
  cameraSmear(t);
};

window.DUR = DUR;
window.seek(0);
window.__resolveReady();
</script>
