<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuroroute — App</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
/* ============================================
   NEUROROUTE · Icon Set (SVG line icons)
   Usage: data-icon="name" on any element → replaced with inline SVG
   ============================================ */
const NR_ICONS = {
  // transport
  truck: '<path d="M3 7h11v8H3zM14 10h4l3 3v2h-7zM7 18a2 2 0 100-4 2 2 0 000 4zM18 18a2 2 0 100-4 2 2 0 000 4z"/>',
  box: '<path d="M12 3l8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10"/>',
  ship: '<path d="M3 14l9-4 9 4-2 6H5zM12 10V4M8 6h8"/>',
  train: '<path d="M6 3h12v11H6zM6 9h12M9 18l-2 3M15 18l2 3M9 18h6"/><circle cx="9" cy="11.5" r="1"/><circle cx="15" cy="11.5" r="1"/>',
  plane: '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>',
  pin: '<path d="M12 21s-7-6-7-11a7 7 0 1114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  // platform / ui
  grid: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
  handshake: '<path d="M3 12l4-4 3 2 4-3 7 5M7 16l3 3 4-4M3 12v4h2M21 12v4h-2"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  bolt: '<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
  brain: '<path d="M9 3a3 3 0 00-3 3 3 3 0 00-1 5 3 3 0 002 5 3 3 0 005 1V4a3 3 0 00-3-1zM15 3a3 3 0 013 3 3 3 0 011 5 3 3 0 01-2 5 3 3 0 01-5 1"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  inbox: '<path d="M3 13l3-9h12l3 9v6H3zM3 13h5l1 2h6l1-2h5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bell: '<path d="M6 9a6 6 0 1112 0c0 5 2 7 2 7H4s2-2 2-7zM10 21h4"/>',
  refresh: '<path d="M21 12a9 9 0 11-3-6.7M21 4v4h-4"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 6a3 3 0 010 6M21 20a6 6 0 00-4-5.6"/>',
  check: '<path d="M5 12l5 5L20 6"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9v6M18 9v6"/>',
  doc: '<path d="M6 2h8l4 4v16H6zM14 2v4h4"/>',
  scroll: '<path d="M6 4h12v13a3 3 0 01-3 3H6a2 2 0 002-2V6a2 2 0 00-2-2zM18 4a2 2 0 012 2v2h-4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  mail: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 13h18"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  telescope: '<path d="M3 14l11-4 2 5-11 4zM14 10l4-6 3 2-3 5M5 18l2 3M9 17l1 4"/>',
  link: '<path d="M9 15l6-6M10 6l1-1a4 4 0 016 6l-1 1M14 18l-1 1a4 4 0 01-6-6l1-1"/>',
  compass: '<circle cx="12" cy="12" r="9"/><path d="M16 8l-2 6-6 2 2-6z"/>',
  door: '<path d="M4 21V4a1 1 0 011-1h10a1 1 0 011 1v17M4 21h16M14 12h.01"/>',
  building: '<path d="M4 21V5a1 1 0 011-1h6a1 1 0 011 1v16M12 21V9a1 1 0 011-1h6a1 1 0 011 1v12M7 8h2M7 12h2M16 12h2M16 16h2"/>',
  rails: '<path d="M6 3L4 21M14 3l-2 18M2 8h14M2 14h12"/>',
  factory: '<path d="M3 21V10l5 3V10l5 3V7l5 3v11zM3 21h18"/>',
  warning: '<path d="M12 3l9 16H3zM12 9v5M12 17h.01"/>',
  split: '<path d="M6 3v6a3 3 0 003 3h6a3 3 0 013 3v6M6 3H3m3 0h3m9 18h-3m3 0h3"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 18l9 5 9-5"/>',
  fog: '<path d="M3 8h18M5 12h14M3 16h18M7 20h10"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/>',
  tag: '<path d="M3 11l8-8 9 9-8 8zM3 11v6a2 2 0 002 2h6"/><circle cx="8.5" cy="8.5" r="1.5"/>',
  trendDown: '<path d="M3 7l6 6 4-4 8 8M21 17v-5h-5"/>',
  repeat: '<path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
  snowflake: '<path d="M12 2v20M4 6l16 12M20 6L4 18"/>',
  droplet: '<path d="M12 3s6 6.5 6 11a6 6 0 11-12 0c0-4.5 6-11 6-11z"/>',
  car: '<path d="M4 16v-3l2-5h12l2 5v3M4 13h16M7 16a1.5 1.5 0 103 0M14 16a1.5 1.5 0 103 0"/>',
  leaf: '<path d="M5 19C5 9 13 4 20 4c0 8-5 15-13 15H5zM5 19c3-5 7-8 11-10"/>',
  shield: '<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/>',
  award: '<circle cx="12" cy="9" r="5"/><path d="M9 13l-2 8 5-3 5 3-2-8"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>',
};

function nrRenderIcons(root) {
  (root||document).querySelectorAll('[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    const path = NR_ICONS[name];
    if (!path) return;
    const size = el.getAttribute('data-size') || 24;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
    el.removeAttribute('data-icon');
  });
}
document.addEventListener('DOMContentLoaded', () => nrRenderIcons());

</script>
<style>
:root {
  --bg:#03050a; --bg2:#070b14; --card:#0f1928; --card2:#131f33;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.1);
  --cyan:#00d4ff; --green:#00ff9d; --amber:#ffb340; --indigo:#4f7cff; --purple:#7c5cfc; --red:#ff4d6d;
  --text:#dde6f5; --muted:#5a6e8a; --muted2:#8a9dbf;
  --display:'Bebas Neue',sans-serif; --body:'Outfit',sans-serif;
  --role:#00d4ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.018) 1px,transparent 1px);background-size:80px 80px;pointer-events:none;z-index:0;}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:0.6;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ===== TOP BAR ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(3,5,10,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:200;}
.tb-left{display:flex;align-items:center;gap:24px;}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:0.04em;color:#fff;display:flex;align-items:center;gap:9px;text-decoration:none;}
.logo-pulse{width:8px;height:8px;background:var(--role);border-radius:50%;box-shadow:0 0 14px var(--role);animation:breathe 2.4s infinite;}
.role-indicator{display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:600;color:var(--role);background:rgba(0,212,255,0.08);border:1px solid var(--border2);padding:5px 14px;border-radius:100px;}
.tb-right{display:flex;align-items:center;gap:14px;}
.role-switch{background:var(--card2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--body);font-size:0.82rem;padding:7px 12px;cursor:pointer;}
.tb-user{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--muted2);}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--role),var(--indigo));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:0.8rem;}
.logout{color:var(--muted);text-decoration:none;font-size:0.82rem;transition:color 0.2s;}
.logout:hover{color:var(--red);}

/* ===== LAYOUT ===== */
.shell{display:flex;padding-top:60px;min-height:100vh;}
.sidebar{position:fixed;top:60px;bottom:0;left:0;width:230px;background:var(--bg2);border-right:1px solid var(--border);padding:24px 14px;overflow-y:auto;}
.nav-section{margin-bottom:24px;}
.nav-label{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--muted2);font-size:0.9rem;font-weight:500;cursor:pointer;transition:all 0.15s;margin-bottom:2px;}
.nav-item:hover{background:var(--card);color:var(--text);}
.nav-item.active{background:rgba(0,212,255,0.1);color:var(--role);}
.nav-item .ic{font-size:1.1rem;width:20px;text-align:center;}
.main{margin-left:230px;flex:1;padding:32px 36px;animation:fadeIn 0.3s;}

/* ===== PAGE HEADER ===== */
.page-title{font-family:var(--display);font-size:2rem;letter-spacing:0.02em;color:#fff;margin-bottom:4px;}
.page-sub{color:var(--muted2);font-size:0.9rem;margin-bottom:28px;}

/* ===== STAT CARDS ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
.stat-label{font-size:0.72rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;}
.stat-value{font-family:var(--display);font-size:1.9rem;color:var(--role);letter-spacing:0.02em;line-height:1;}
.stat-change{font-size:0.74rem;color:var(--muted2);margin-top:5px;}
.stat-change.up{color:var(--green);}

/* ===== CARDS / PANELS ===== */
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.panel-title{font-family:var(--display);font-size:1.2rem;letter-spacing:0.03em;color:#fff;}
.panel-action{font-size:0.82rem;color:var(--role);cursor:pointer;text-decoration:none;}

/* ===== TABLE / ROWS ===== */
.rows{display:flex;flex-direction:column;gap:8px;}
.row{display:grid;gap:14px;align-items:center;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:0.86rem;transition:border-color 0.2s;}
.row:hover{border-color:var(--border2);}
.row .rid{color:var(--muted);font-size:0.76rem;}
.row .rmain{color:#fff;font-weight:600;}
.row .rsub{color:var(--muted2);font-size:0.8rem;}
.row .rprice{font-family:var(--display);font-size:1.2rem;color:var(--role);letter-spacing:0.02em;}
.badge{font-size:0.68rem;font-weight:700;letter-spacing:0.04em;padding:3px 10px;border-radius:100px;white-space:nowrap;display:inline-block;}
.badge.green{background:rgba(0,255,157,0.1);color:var(--green);border:1px solid rgba(0,255,157,0.25);}
.badge.cyan{background:rgba(0,212,255,0.08);color:var(--cyan);border:1px solid rgba(0,212,255,0.2);}
.badge.amber{background:rgba(255,179,64,0.1);color:var(--amber);border:1px solid rgba(255,179,64,0.25);}
.badge.indigo{background:rgba(79,124,255,0.1);color:var(--indigo);border:1px solid rgba(79,124,255,0.25);}
.badge.muted{background:rgba(255,255,255,0.04);color:var(--muted2);border:1px solid var(--border);}
.badge.red{background:rgba(255,77,109,0.1);color:var(--red);border:1px solid rgba(255,77,109,0.25);}

/* ===== BUTTONS ===== */
.btn{background:var(--role);color:#000;font-family:var(--body);font-weight:700;font-size:0.82rem;padding:9px 18px;border:none;border-radius:6px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-block;}
.btn:hover{opacity:0.88;transform:translateY(-1px);}
.btn-sm{padding:6px 13px;font-size:0.76rem;}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border2);}
.btn-ghost:hover{border-color:var(--role);}
.btn-green{background:var(--green);}
.btn-block{display:block;width:100%;text-align:center;}

/* ===== FORM ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{margin-bottom:16px;}
.field.full{grid-column:1/-1;}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--muted2);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;color:var(--text);font-family:var(--body);font-size:0.9rem;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--role);}

/* ===== TRACKING TIMELINE ===== */
.track-stage{display:flex;gap:14px;align-items:flex-start;}
.track-dot-col{display:flex;flex-direction:column;align-items:center;}
.track-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.track-dot.done{background:var(--green);box-shadow:0 0 8px var(--green);}
.track-dot.current{width:16px;height:16px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:breathe 1.5s infinite;}
.track-dot.todo{background:var(--bg);border:2px solid var(--muted);}
.track-line{width:2px;flex:1;min-height:28px;}
.track-line.done{background:var(--green);}
.track-line.todo{background:var(--border);}
.track-info{padding-bottom:14px;}
.track-info .ts{font-size:0.74rem;color:var(--muted);}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ic{font-size:2.5rem;margin-bottom:12px;opacity:0.5;}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:fadeIn 0.25s;}
.modal h2{font-family:var(--display);font-size:1.6rem;letter-spacing:0.03em;margin-bottom:6px;}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--green);border-radius:10px;padding:14px 20px;color:var(--text);font-size:0.9rem;z-index:400;display:flex;align-items:center;gap:10px;animation:fadeIn 0.3s;box-shadow:0 10px 40px rgba(0,0,0,0.4);}
.toast .ic{color:var(--green);font-size:1.2rem;}

/* offer list inside abnehmer */
.offer{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
.offer.best{border-color:rgba(0,255,157,0.3);background:rgba(0,255,157,0.04);}
.offer .oc-name{font-weight:600;color:#fff;font-size:0.88rem;}
.offer .oc-meta{font-size:0.76rem;color:var(--muted2);}
.offer .oprice{font-family:var(--display);font-size:1.3rem;color:var(--role);}
.offer.best .oprice{color:var(--green);}

/* phone for fahrer */
.phone-frame{max-width:360px;margin:0 auto;background:var(--card);border:2px solid var(--border2);border-radius:28px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.phone-inner{background:var(--bg2);border-radius:18px;padding:22px 18px;}
.status-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.status-btn{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px 8px;font-size:0.8rem;color:var(--text);text-align:center;cursor:pointer;font-weight:500;transition:all 0.2s;}
.status-btn:hover{border-color:var(--green);}
.status-btn.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}

@media(max-width:900px){
  .sidebar{display:none;}
  .main{margin-left:0;padding:24px 18px;}
  .stats{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .role-indicator span.rtext{display:none;}
}

/* ============================================
   NEUROROUTE · High-Tech FX Layer
   ============================================ */

/* Animated aurora background */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 800px 600px at 15% 10%, rgba(0,212,255,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 85% 20%, rgba(79,124,255,0.09), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 100%, rgba(124,92,252,0.08), transparent 60%);
  animation: auroraShift 18s ease-in-out infinite;
}
@keyframes auroraShift {
  0%,100% { opacity: 0.7; transform: translate3d(0,0,0) scale(1); }
  33%     { opacity: 1;   transform: translate3d(2%,-1%,0) scale(1.05); }
  66%     { opacity: 0.85;transform: translate3d(-2%,1%,0) scale(1.02); }
}

/* Floating particles canvas sits behind content */
#fx-particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
nav, section, footer, .modal-bg { position: relative; z-index: 1; }

/* Hero parallax orbs follow mouse */
.hero-orb1, .hero-orb2 { transition: transform 0.5s cubic-bezier(.2,.7,.2,1); will-change: transform; }

/* Glow pulse on primary buttons */
.btn-main, .nav-cta {
  position: relative; overflow: hidden;
  box-shadow: 0 0 0 rgba(0,212,255,0);
  animation: ctaGlow 3.5s ease-in-out infinite;
}
@keyframes ctaGlow {
  0%,100% { box-shadow: 0 4px 20px rgba(0,212,255,0.18); }
  50%     { box-shadow: 0 6px 34px rgba(0,212,255,0.42); }
}
/* Shine sweep across buttons */
.btn-main::before, .nav-cta::before {
  content: ''; position: absolute; top: 0; left: -120%;
  width: 80%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
  transform: skewX(-18deg);
  animation: shineSweep 4.5s ease-in-out infinite;
}
@keyframes shineSweep {
  0%, 60% { left: -120%; }
  80%,100% { left: 130%; }
}

/* Cards: glow border + lift + sheen on hover */
.card, .price-card, .uc, .article, .pf-section, .listing, .step, .stat {
  transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s, border-color 0.35s;
}
.card:hover, .price-card:hover, .article:hover, .step:hover {
  box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 30px rgba(0,212,255,0.12);
}

/* Gradient text gets animated shimmer */
.gradient-text {
  background: linear-gradient(110deg, var(--cyan), var(--indigo), var(--purple), var(--cyan));
  background-size: 300% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmerText 6s linear infinite;
}
@keyframes shimmerText { to { background-position: 300% center; } }

/* Section tag gets a pulsing dot */
.section-tag { display: inline-flex; align-items: center; gap: 9px; }
.section-tag::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 12px var(--cyan);

}

/* Logo pulse stronger */

/* Scroll reveal: richer entrance */

.reveal.visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }

/* Scroll progress bar */
#fx-progress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--purple));
  box-shadow: 0 0 12px rgba(0,212,255,0.6); z-index: 999;

}

/* Nav gains glass depth on scroll */
nav.scrolled { background: rgba(3,5,10,0.92); box-shadow: 0 8px 40px rgba(0,0,0,0.4); }

/* Magnetic hover for nav links */
.nav-links a::after {
  content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 2px;

}
.nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

/* Stat numbers glow subtly */
.stat-value, .pf-stat .v { text-shadow: 0 0 24px rgba(0,212,255,0.25); }

@media (prefers-reduced-motion: reduce) {
  body::after, .btn-main, .nav-cta, .btn-main::before, .nav-cta::before,

async function verifyUser(id) {
  const users = await dbGet('nr_users', []);
  const u = users.find(x=>x.id===id); if(u) u.status='verified';
  await dbSet('nr_users', users);
  toast('Nutzer freigeschaltet ✓');
  render();
}

function openOfferModal(reqId) {
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Angebot abgeben</h2>
    <p style="color:var(--muted);font-size:0.86rem;margin-bottom:20px;">Auftrag #${reqId}</p>
    <div class="field"><label>Ihr Preis (€)</label><input id="offer_price" type="number" placeholder="1800"></div>
    <div class="field"><label>Voraussichtliche Lieferzeit</label><input id="offer_eta" placeholder="z.B. 42h"></div>
    <button class="btn btn-block" onclick="submitOffer('${reqId}')">Angebot senden →</button>
  `);
}
async function submitOffer(reqId) {
  const price = document.getElementById('offer_price').value || '1800';
  const eta = document.getElementById('offer_eta').value || '42h';
  const offers = await dbGet('nr_offers', {});
  if(!offers[reqId]) offers[reqId]=[];
  offers[reqId].unshift({carrier:'Müller Spedition GmbH', rating:4.9, jobs:1240, eta, price:parseInt(price), internal:true});
  await dbSet('nr_offers', offers);
  // set request to matching
  const reqs = await dbGet('nr_requests', []);
  const r = reqs.find(x=>x.id===reqId);
  if(r && r.status==='open'){ r.status='matching'; if(!r.stages.includes('matching'))r.stages.push('matching'); }
  await dbSet('nr_requests', reqs);
  closeModal();
  toast('Angebot gesendet ✓');
  render();
}

async function viewOffers(reqId) {
  const offers = (await dbGet('nr_offers', {}))[reqId] || [];
  const reqs = await dbGet('nr_requests', []);
  const r = reqs.find(x=>x.id===reqId);
  const sorted = [...offers].sort((a,b)=>a.price-b.price);
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Angebote</h2>
    <p style="color:var(--muted);font-size:0.86rem;margin-bottom:20px;">${r.from} → ${r.to} · #${reqId}</p>
    ${sorted.length===0?'<div class="empty"><div class="ic">…</div>Noch keine Angebote eingegangen</div>':
    sorted.map((o,i)=>`<div class="offer ${i===0?'best':''}">
      <div>${i===0?'<div style="font-size:0.62rem;color:var(--green);font-weight:700;letter-spacing:0.06em;margin-bottom:2px;">★ BESTES ANGEBOT'+(o.internal?' · INTERNER PARTNER':'')+'</div>':''}
        <div class="oc-name">${o.carrier}</div><div class="oc-meta">${o.rating}★ · ${o.jobs} Aufträge · ETA ${o.eta}</div></div>
      <span class="oprice">€${o.price}</span>
      <button class="btn btn-sm ${i===0?'btn-green':''}" onclick="acceptOffer('${reqId}','${o.carrier.replace(/'/g,'')}',${o.price})">Annehmen</button>
    </div>`).join('')}
  `);
}
async function acceptOffer(reqId, carrier, price) {
  const reqs = await dbGet('nr_requests', []);
  const r = reqs.find(x=>x.id===reqId);
  if(r){ r.status='in_transit'; r.carrier=carrier; r.accepted=price; r.stages=['created','confirmed','pickup','in_transit']; }
  await dbSet('nr_requests', reqs);
  closeModal();
  toast('Auftrag vergeben an '+carrier+' ✓');
  render();
}

async function viewTracking(reqId) {
  const reqs = await dbGet('nr_requests', []);
  const r = reqs.find(x=>x.id===reqId);
  const done = r.stages;
  const allShown = ['created','confirmed','pickup','in_transit','terminal','delivered'];
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Tracking</h2>
    <p style="color:var(--muted);font-size:0.86rem;margin-bottom:24px;">${r.from} → ${r.to} · #${reqId}</p>
    <div>
    ${allShown.map((st,i)=>{
      const isDone = done.includes(st);
      const isCurrent = done[done.length-1]===st;
      const isLast = i===allShown.length-1;
      return `<div class="track-stage">
        <div class="track-dot-col">
          <div class="track-dot ${isCurrent?'current':isDone?'done':'todo'}"></div>
          ${!isLast?`<div class="track-line ${isDone&&done.includes(allShown[i+1])?'done':'todo'}"></div>`:''}
        </div>
        <div class="track-info"><strong style="color:${isCurrent?'var(--cyan)':isDone?'#fff':'var(--muted2)'};font-size:0.9rem;">${STAGE_LABELS[st]}</strong>
        ${isCurrent?'<div class="ts">jetzt</div>':''}</div>
      </div>`;
    }).join('')}
    </div>
  `);
}

async function createOrder() {
  const from = document.getElementById('f_from').value;
  const to = document.getElementById('f_to').value;
  if(!from || !to){ toast('Bitte Start und Ziel angeben'); return; }
  const reqs = await dbGet('nr_requests', []);
  const num = 4274 + reqs.filter(r=>r.id.startsWith('NR-42')&&parseInt(r.id.slice(3))>=4274).length;
  const newReq = {
    id:'NR-'+num, from, to,
    weight: document.getElementById('f_weight').value||'—',
    mode: document.getElementById('f_mode').value,
    deadline: document.getElementById('f_deadline').value||'—',
    price: parseInt(document.getElementById('f_price').value)||1500,
    status:'open', shipper:'Stahlwerk Bremen AG', carrier:null, accepted:null, stages:['created']
  };
  reqs.unshift(newReq);
  await dbSet('nr_requests', reqs);
  toast('Auftrag #'+newReq.id+' eingestellt ✓ — Partner werden geprüft');
  goPage('myrequests');
}

    <div class="form-grid">
      <div class="field"><label>Startort</label><input id="cap_from" placeholder="z.B. Hamburg"></div>
      <div class="field"><label>Zielort</label><input id="cap_to" placeholder="z.B. München"></div>
      <div class="field"><label>Datum</label><input id="cap_date" placeholder="z.B. in 14 Tagen"></div>
      <div class="field"><label>Transportmodus</label><select id="cap_mode"><option>Straße</option><option>Schiene</option><option>See</option><option>Luft</option><option>Multimodal</option></select></div>
      <div class="field"><label>Kapazität</label><input id="cap_cap" placeholder="z.B. 24t"></div>
      <div class="field"><label>Auslastung</label><input id="cap_util" placeholder="z.B. 80%"></div>
    </div>
    <button class="btn btn-block" onclick="addCapacity()">Transport hinzufügen →</button>
  `);
}
async function addCapacity() {
  const from = document.getElementById('cap_from').value;
  const to = document.getElementById('cap_to').value;
  if(!from||!to){ toast('Bitte Start und Ziel angeben'); return; }
  const cap = await dbGet('nr_capacity', []);
  cap.unshift({id:'C-'+(cap.length+1), from, to,
    date: document.getElementById('cap_date').value||'—',
    mode: document.getElementById('cap_mode').value,
    cap: document.getElementById('cap_cap').value||'—',
    util: document.getElementById('cap_util').value||'—',
    recurring:false, returnEmpty:true});
  await dbSet('nr_capacity', cap);
  closeModal();
  toast('Transport geplant ✓ — Rückfahrt kann angeboten werden');
  render();
}

}
async function doPublish(from, to) {
  const old = parseInt(document.getElementById('mk_old').value)||1000;
  const disc = parseInt(document.getElementById('mk_disc').value)||20;
  const cap = document.getElementById('mk_cap').value||'Freie Kapazität';
  const price = Math.round(old*(1-disc/100));
  const market = await dbGet('nr_market', []);
  market.unshift({id:'M-'+(market.length+1), from, to, mode:'Straße', detail:cap+' · Rückfahrt', price, old, disc, by:'Müller Spedition GmbH'});
  await dbSet('nr_market', market);
  closeModal();
  toast('Auf Marktplatz veröffentlicht ✓');
  goPage('marketplace');
}
function openMarketModal() {
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>Kapazität anbieten</h2>

async function doMarketAdd() {
  const from = document.getElementById('mk2_from').value;
  const to = document.getElementById('mk2_to').value;
  if(!from||!to){ toast('Bitte Start und Ziel angeben'); return; }
  const old = parseInt(document.getElementById('mk2_old').value)||1000;
  const disc = parseInt(document.getElementById('mk2_disc').value)||15;
  const price = Math.round(old*(1-disc/100));
  const market = await dbGet('nr_market', []);
  market.unshift({id:'M-'+(market.length+1), from, to, mode:'Straße',
    detail: document.getElementById('mk2_detail').value||'Freie Kapazität',
    price, old, disc, by:'Müller Spedition GmbH'});
  await dbSet('nr_market', market);
  closeModal();
  toast('Auf Marktplatz veröffentlicht ✓');
  render();
}

async function driverStatus(reqId, label) {
  const reqs = await dbGet('nr_requests', []);
  const r = reqs.find(x=>x.id===reqId);
  const map = {'Beladen':'pickup','Unterwegs':'in_transit','Pause':'in_transit','Entladen':'delivered'};
  const st = map[label];
  if(r && !r.stages.includes(st)) r.stages.push(st);
  if(label==='Entladen'){ r.status='delivered'; }
  await dbSet('nr_requests', reqs);
  toast('Status gemeldet: '+label+' ✓');
  render();
}

init();

<script>window.__nrFx = true; /* app uses its own subtle styling, skip heavy FX */</script>
<script>
/* ============================================
   NEUROROUTE · High-Tech FX Engine
   ============================================ */
(function(){
  if (window.__nrFx) return; window.__nrFx = true;

  function ready(fn){ if(document.readyState!='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }

  ready(function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // --- Scroll progress bar ---
    var bar = document.createElement('div'); bar.id = 'fx-progress'; document.body.appendChild(bar);
    function onScroll(){
      var h = document.documentElement;
      var p = (h.scrollTop) / (h.scrollHeight - h.clientHeight || 1);
      bar.style.width = (p*100) + '%';
      var nav = document.querySelector('nav');
      if (nav){ if (h.scrollTop > 20) nav.classList.add('scrolled'); else nav.classList.remove('scrolled'); }
    }
    document.addEventListener('scroll', onScroll, {passive:true}); onScroll();

    // --- Mouse parallax on hero orbs ---
    if (!reduce) {
      var orb1 = document.querySelector('.hero-orb1'), orb2 = document.querySelector('.hero-orb2');
      window.addEventListener('mousemove', function(e){
        var x = (e.clientX / window.innerWidth - 0.5);
        var y = (e.clientY / window.innerHeight - 0.5);
        if (orb1) orb1.style.transform = 'translate(calc(-50% + '+(x*40)+'px), calc(-58% + '+(y*40)+'px))';
        if (orb2) orb2.style.transform = 'translate('+(x*-30)+'px, '+(y*-30)+'px)';
      }, {passive:true});
    }

    // --- Particle network canvas ---
    if (!reduce) {
      var c = document.createElement('canvas'); c.id = 'fx-particles';
      document.body.insertBefore(c, document.body.firstChild);
      var ctx = c.getContext('2d'), W, H, pts, DPR = Math.min(window.devicePixelRatio||1, 2);
      function resize(){
        W = c.width = innerWidth*DPR; H = c.height = innerHeight*DPR;
        c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
        var n = Math.min(70, Math.floor(innerWidth/22));
        pts = []; for (var i=0;i<n;i++) pts.push({
          x: Math.random()*W, y: Math.random()*H,
          vx: (Math.random()-0.5)*0.25*DPR, vy: (Math.random()-0.5)*0.25*DPR
        });
      }
      resize(); addEventListener('resize', resize, {passive:true});
      var mx = -9999, my = -9999;
      addEventListener('mousemove', function(e){ mx = e.clientX*DPR; my = e.clientY*DPR; }, {passive:true});
      function tick(){
        ctx.clearRect(0,0,W,H);
        for (var i=0;i<pts.length;i++){
          var p = pts[i]; p.x+=p.vx; p.y+=p.vy;
          if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
          // link to mouse
          var dmx = p.x-mx, dmy = p.y-my, dm = Math.sqrt(dmx*dmx+dmy*dmy);
          for (var j=i+1;j<pts.length;j++){
            var q = pts[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.sqrt(dx*dx+dy*dy);
            if (d < 130*DPR){
              ctx.strokeStyle = 'rgba(0,212,255,'+(0.12*(1-d/(130*DPR)))+')';
              ctx.lineWidth = DPR*0.6;
              ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
            }
          }
          var near = dm < 160*DPR;
          ctx.fillStyle = near ? 'rgba(0,255,157,'+(0.7*(1-dm/(160*DPR)))+')' : 'rgba(0,212,255,0.45)';
          ctx.beginPath(); ctx.arc(p.x,p.y, (near?2.2:1.4)*DPR, 0, 6.28); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      tick();
    }

    // --- Tilt on cards ---
    if (!reduce) {
      document.querySelectorAll('.card, .price-card, .uc, .article').forEach(function(el){
        el.addEventListener('mousemove', function(e){
          var r = el.getBoundingClientRect();
          var rx = ((e.clientY-r.top)/r.height - 0.5) * -5;
          var ry = ((e.clientX-r.left)/r.width - 0.5) * 5;
          el.style.transform = 'translateY(-4px) perspective(800px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
        });
        el.addEventListener('mouseleave', function(){ el.style.transform = ''; });
      });
    }
  });
})();
</script>
